<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本息平均攤還試算</title>
<style>
:root{
  --ink:#111111;
  --rhein-blue:#003399;
  --rhein-blue-deep:#002266;
  --rhein-blue-light:#e8f1ff;
  --line:#c9d8f0;
  --shadow:0 10px 24px rgba(0,51,153,.18);
}

*{
  box-sizing:border-box;
  font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif
}

body{
  padding:18px 10px;
  margin:0;
  color:var(--ink);
  background:#f4f8ff;
}

.wrap{
  max-width:820px;
  margin:0 auto;
  background:#fff;
  border-radius:18px;
  border:1px solid #dce8fb;
  box-shadow:var(--shadow);
  overflow:hidden;
}

.title-bar{
  padding:22px 16px;
  text-align:center;
  color:#fff;
  font-size:22px;
  font-weight:800;
  letter-spacing:2px;
  background:linear-gradient(120deg,#003399 0%,#0052cc 100%);
}

.vt-toggle-row{
  display:flex;
  gap:8px;
  padding:8px;
  background:#f4f8ff;
  border-bottom:1px solid var(--line);
  align-items:center;
}

.vt-btn{
  flex:1;
  padding:10px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  font-size:14px;
  cursor:pointer;
  color:#003399;
  font-weight:700;
}

.vt-btn.active{
  background:#003399;
  color:#fff;
}

.input-area{
  padding:22px;
  background:#f4f8ff;
}

.input-row{
  display:flex;
  align-items:center;
  margin:11px 0;
  gap:10px;
}

.input-row label{
  width:180px;
  padding:3px;
  font-size:15px;
  font-weight:700;
  color:#003399;
}

.input-row input{
  width:220px;
  min-width:0;
  padding:10px 12px;
  font-size:15px;
  color:var(--ink);
  background:#fff;
  border:1px solid #9cb6e8;
  border-radius:11px;
  outline:none;
}

.input-row input:focus{
  border-color:#003399;
  box-shadow:0 0 0 3px rgba(0,51,153,.2);
}

.input-row .unit{
  padding:0 3px;
  font-size:14px;
  color:#335599;
}

.inline-group{
  display:flex;
  gap:6px;
  align-items:center;
}

.inline-group input{
  width:94px;
}

.btn-group{
  text-align:center;
  margin:20px 0 2px;
}

button{
  padding:9px 17px;
  font-size:14px;
  margin:3px;
  cursor:pointer;
  font-family:inherit;
  color:#fff;
  background:#003399;
  border:0;
  border-radius:999px;
  box-shadow:0 3px 0 #002266;
  transition:transform .15s,filter .15s;
}

button:hover{
  filter:brightness(1.08);
  transform:translateY(-1px);
}

button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #002266;
}

button.primary{
  background:#0052cc;
  box-shadow:0 3px 0 #003399;
}

button.primary:hover{
  background:#0044aa;
}

.result-block{
  padding:18px;
}

/* 上方參數列 */
.result-topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  background:#e8f1ff;
  border:1px solid #c9d8f0;
  border-radius:13px;
  padding:12px 14px;
  margin-bottom:16px;
}

.param-strip{
  display:flex;
  flex-wrap:wrap;
  gap:4px 12px;
  font-size:13px;
  line-height:1.6;
  color:#111;
}

.param-strip b{
  color:#003399;
}

.btn-toggle-full{
  flex-shrink:0;
  padding:8px 14px;
  font-size:13px;
  border:none;
  border-radius:999px;
  background:#003399;
  color:#fff;
  cursor:pointer;
  box-shadow:0 3px 0 #002266;
}

.btn-toggle-full:hover{
  background:#002266;
}

/* Tab 切換 */
.tab-bar{
  display:flex;
  gap:6px;
  margin-bottom:14px;
}

.tab-btn{
  padding:9px 16px;
  border-radius:11px;
  background:#e8f1ff;
  color:#003399;
  border:1px solid #c9d8f0;
  cursor:pointer;
  font-weight:700;
}

.tab-btn.active{
  background:#003399;
  color:#fff;
  border-color:#003399;
}

.tab-panel{
  display:none;
}

.tab-panel.active{
  display:block;
}

/* 四張摘要卡片 */
.result-summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.sum-card{
  position:relative;
  border:1px solid #dce8fb;
  border-radius:15px;
  padding:14px 12px 14px 18px;
  background:#fff;
  box-shadow:0 4px 14px rgba(0,51,153,.12);
  text-align:left;
  overflow:hidden;
}

.sum-card::before{
  content:"";
  position:absolute;
  left:0;
  top:14px;
  bottom:14px;
  width:5px;
  background:#003399;
  border-radius:0 4px 4px 0;
}

.sum-label{
  font-size:14px;
  color:#333;
  font-weight:700;
  margin-bottom:10px;
}

.sum-value{
  font-size:24px;
  font-weight:800;
  color:#003399;
  white-space:nowrap;
}

/* 利息拆解 */
.interest-analysis{
  display:flex;
  justify-content:center;
  margin-bottom:18px;
}

.analysis-card{
  border:1px solid #dce8fb;
  border-radius:15px;
  padding:16px 24px;
  text-align:center;
  background:#fff;
  box-shadow:0 4px 14px rgba(0,51,153,.12);
  min-width:240px;
}

.analysis-label{
  font-size:14px;
  color:#333;
  font-weight:700;
  margin-bottom:8px;
}

.analysis-value{
  font-size:26px;
  font-weight:800;
  color:#003399;
}

/* 明細表 */
.detail-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin:18px 0 10px;
}

h4{
  font-size:15px;
  color:#003399;
  margin:0;
}

table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  overflow:hidden;
  border-radius:12px;
}

th{
  background:#003399;
  color:#fff;
  padding:10px 5px;
  text-align:center;
  font-size:14px;
}

td{
  border-bottom:1px solid #dce8fb;
  padding:8px 5px;
  text-align:center;
  font-size:13px;
  color:#111;
}

tr.odd-year{
  background:#ffffff;
}

tr.even-year{
  background:#f4f8ff;
}

tr.odd-year td,
tr.even-year td{
  background:transparent;
}

tr.year-start td{
  border-top:2px solid #9cb6e8;
}

.omit-row td{
  text-align:center;
  color:#003399;
  background:#e8f1ff;
  font-size:13px;
  border-top:1px dashed #9cb6e8;
  border-bottom:1px dashed #9cb6e8;
}

.full-btn{
  background:#0052cc;
  box-shadow:0 3px 0 #003399;
}

.tip-wrap{
  margin-top:16px;
  padding:14px;
  border-radius:15px;
  background:#e8f1ff;
  border:1px dashed #9cb6e8;
}

.tip-text{
  font-size:14px;
  color:#111;
  margin-bottom:10px;
  line-height:1.7;
}

.copy-btn,
.snap-btn{
  padding:8px 13px;
  font-size:13px;
}

.copy-btn{
  background:#0052cc;
  box-shadow:0 3px 0 #003399;
}

.snap-btn{
  background:#335599;
  box-shadow:0 3px 0 #002266;
}

/* 手機版 */
@media(max-width:720px){
  .result-summary{
    grid-template-columns:1fr 1fr;
  }

  .result-topbar{
    flex-direction:column;
    align-items:flex-start;
  }

  .sum-value{
    font-size:22px;
  }

  .detail-header{
    flex-direction:column;
    align-items:flex-start;
  }
}

@media(max-width:560px){
  body{
    padding:0;
  }

  .wrap{
    border-radius:0;
  }

  .input-row label{
    width:145px;
    font-size:13px;
  }

  .input-row input{
    width:180px;
  }

  .inline-group input{
    width:75px;
  }

  th{
    font-size:11px;
    padding:7px 2px;
  }

  td{
    font-size:11px;
    padding:6px 2px;
  }
}

@media print{
  body{
    background:#fff;
  }

  .vt-toggle-row,
  .input-area,
  .btn-group,
  .tip-wrap,
  button:not(.keep-print){
    display:none !important;
  }

  .wrap{
    border:none;
    box-shadow:none;
  }

  .result-block{
    display:block !important;
  }

  .result-topbar,
  .tab-bar,
  .tab-panel,
  .detail-header,
  table{
    page-break-inside:avoid;
  }
}
</style>
</head>
<body data-mode="web">
<div class="wrap">
  <div class="title-bar">本息平均攤還試算</div>

  <div class="vt-toggle-row">
    <button class="vt-btn active" data-mode="web">網頁版</button>
    <button class="vt-btn" data-mode="mobile">手機版</button>
  </div>

  <div class="input-area">
    <div class="input-row">
      <label>貸款金額（萬元）</label>
      <input type="number" id="principal" value="">
    </div>

    <div class="input-row">
      <label>貸款年數</label>
      <input type="number" id="loanYear" value="">
    </div>

    <div class="input-row">
      <label>貸款起始（民國年月）</label>
      <div class="inline-group">
        <input type="number" id="rocYear" value="">
        <span class="unit">年</span>
        <input type="number" id="rocMonth" value="">
        <span class="unit">月</span>
      </div>
    </div>

    <div class="input-row">
      <label>年利率（%）</label>
      <input type="number" step="0.01" id="rate" value="">
    </div>

    <div class="btn-group">
      <button class="primary" onclick="calc()">試算</button>
      <button onclick="clearAll()">清除</button>
      <button onclick="printResult()">列印</button>
    </div>
  </div>

  <div class="result-block" id="resultBlock" style="display:none;">

    <!-- 上方參數列 + 右側按鈕 -->
    <div class="result-topbar">
      <div class="param-strip" id="paramStrip"></div>
      <button class="btn-toggle-full keep-print" id="toggleFullBtn" onclick="toggleFullList()">顯示全部期數</button>
    </div>

    <!-- Tab 切換 -->
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="tab1">總覽</button>
      <button class="tab-btn" data-tab="tab2">利息拆解</button>
    </div>

    <!-- 總覽：四張卡片 -->
    <div class="tab-panel active" id="tab1">
      <div class="result-summary">
        <div class="sum-card">
          <div class="sum-label">每月應繳金額</div>
          <div class="sum-value" id="monthPayText"></div>
        </div>
        <div class="sum-card">
          <div class="sum-label">貸款本金</div>
          <div class="sum-value" id="priText"></div>
        </div>
        <div class="sum-card">
          <div class="sum-label">總利息金額</div>
          <div class="sum-value" id="totalIntText"></div>
        </div>
        <div class="sum-card">
          <div class="sum-label">總繳款金額</div>
          <div class="sum-value" id="totalPayText"></div>
        </div>
      </div>
    </div>

    <!-- 利息拆解 -->
    <div class="tab-panel" id="tab2">
      <div class="interest-analysis">
        <div class="analysis-card">
          <div class="analysis-label">利息占比</div>
          <div class="analysis-value" id="rateText"></div>
        </div>
      </div>
    </div>

    <!-- 明細表 -->
    <div class="detail-header">
      <h4 id="detailTitle">還款明細表（僅顯示前8期與後8期，中間期數省略）</h4>
    </div>

    <table>
      <thead>
        <tr>
          <th>期數</th>
          <th>繳款日期</th>
          <th>每月應繳</th>
          <th>本金</th>
          <th>利息</th>
          <th>剩餘本金</th>
        </tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>

    <div class="tip-wrap">
      <div class="tip-text" id="autoTip"></div>
      <button class="copy-btn keep-print" id="copyBtn" onclick="copyTip()">一鍵複製這段文字</button>
      <button class="snap-btn keep-print" id="snapBtn" onclick="openWinSnipping()">系統截圖(Win+Shift+S)</button>
    </div>
  </div>
</div>

<script>
let lastCalc = null;
let tipContent = "";
let showAll = false;

// 頁面載入自動填入當前民國年月
(function initNowDate(){
  const now = new Date();
  const yy = now.getFullYear() - 1911;
  const mm = now.getMonth() + 1;
  document.getElementById('rocYear').value = yy;
  document.getElementById('rocMonth').value = mm;
})();

function setMode(mode){
  document.body.dataset.mode = mode;
  document.querySelectorAll('.vt-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  if(lastCalc){
    renderResult();
  }else{
    backToInput();
  }
}

document.querySelectorAll('.vt-btn').forEach(btn=>btn.onclick=()=>setMode(btn.dataset.mode));

document.querySelectorAll('.tab-btn').forEach(function(btn){
  btn.onclick = function(){
    var t = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-panel').forEach(function(p){ p.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById(t).classList.add('active');
  };
});

function calc(){
  const PWan = Number(document.getElementById('principal').value);
  const year = Number(document.getElementById('loanYear').value);
  const apr = Number(document.getElementById('rate').value);
  const rocY = Number(document.getElementById('rocYear').value);
  const rocM = Number(document.getElementById('rocMonth').value);

  if(!PWan || !year || !apr || !rocY || !rocM){
    alert('請填寫貸款金額、年數、年利率、起算年月');
    return;
  }

  const P = PWan * 10000;
  const i = apr / 100 / 12;
  const n = year * 12;
  let payRate;

  if(Math.abs(i) < 1e-12){
    payRate = 1 / n;
  }else{
    payRate = (Math.pow(1+i,n) * i) / (Math.pow(1+i,n) - 1);
  }

  const monthPay = P * payRate;
  let balance = P;
  let totalInterest = 0;
  const rows = [];
  let cy = rocY;
  let cm = rocM;

  for(let k = 1; k <= n; k++){
    let intMonth = balance * i;
    let priMonth = monthPay - intMonth;

    if(k === n){
      priMonth = balance;
      intMonth = monthPay - priMonth;
    }

    balance = balance - priMonth;
    totalInterest += intMonth;

    let dateStr = cy + '/' + String(cm).padStart(2,'0');
    rows.push({
      period: k,
      date: dateStr,
      monthPay: monthPay,
      pri: priMonth,
      int: intMonth,
      bal: balance
    });

    cm++;
    if(cm > 12){
      cm = 1;
      cy++;
    }
  }

  lastCalc = {
    PWan: PWan,
    year: year,
    apr: apr,
    rocY: rocY,
    rocM: rocM,
    P: P,
    monthPay: monthPay,
    totalInterest: totalInterest,
    rows: rows
  };

  showAll = false;
  renderResult();
}

function toggleFullList(){
  showAll = !showAll;
  renderResult();
}

function renderResult(){
  if(!lastCalc) return;

  const d = lastCalc;
  const isMobile = document.body.dataset.mode === 'mobile';

  document.getElementById('paramStrip').innerHTML =
    '<span>貸款金額 <b>' + d.PWan.toLocaleString() + ' 萬</b></span>' +
    '<span>年數 <b>' + d.year + ' 年</b></span>' +
    '<span>年利率 <b>' + d.apr + '%</b></span>' +
    '<span>起算 <b>' + d.rocY + '/' + String(d.rocM).padStart(2,'0') + '</b></span>';

  const monthPayRound = Math.round(d.monthPay);
  document.getElementById('monthPayText').innerText = monthPayRound.toLocaleString() + ' 元';
  document.getElementById('priText').innerText = d.PWan.toLocaleString() + ' 萬';
  document.getElementById('totalPayText').innerText = Math.round(d.P + d.totalInterest).toLocaleString() + ' 元';
  document.getElementById('totalIntText').innerText = Math.round(d.totalInterest).toLocaleString() + ' 元';

  const totalPeriod = d.year * 12;
  tipContent = '幫您試算的是貸款金額' + d.PWan.toLocaleString() + '萬，分期' + d.year + '年' + totalPeriod + '期，每月應繳金額' + monthPayRound.toLocaleString() + '元，您看一下月付金額您能不能負擔';
  document.getElementById('autoTip').innerText = tipContent;

  if(document.getElementById('rateText')){
    document.getElementById('rateText').innerText = (d.totalInterest / (d.P + d.totalInterest) * 100).toFixed(2) + ' %';
  }

  const tbody = document.getElementById('scheduleBody');
  tbody.innerHTML = '';

  if(showAll){
    document.getElementById('detailTitle').innerText = '還款明細表（顯示全部期數）';
    document.getElementById('toggleFullBtn').innerText = '縮減顯示';
    d.rows.forEach(function(r){ addRow(tbody, r); });
  }else{
    const front = isMobile ? 6 : 8;
    const back = isMobile ? 6 : 8;
    document.getElementById('detailTitle').innerText = '還款明細表（僅顯示前' + front + '期與後' + back + '期，中間期數省略）';
    document.getElementById('toggleFullBtn').innerText = '顯示全部期數';
    d.rows.slice(0, front).forEach(function(r){ addRow(tbody, r); });

    const omitTr = document.createElement('tr');
    omitTr.className = 'omit-row';
    omitTr.innerHTML = '<td colspan="6">……中間期數省略……</td>';
    tbody.appendChild(omitTr);

    d.rows.slice(-back).forEach(function(r){ addRow(tbody, r); });
  }

  document.getElementById('resultBlock').style.display = 'block';
  document.querySelector('.input-area').style.display = isMobile ? 'none' : 'block';
  window.scrollTo(0, 0);
}

function addRow(tbody, r){
  const tr = document.createElement('tr');
  const yearSeq = Math.ceil(r.period / 12);
  tr.className = (yearSeq % 2 === 1) ? 'odd-year' : 'even-year';

  if(r.period > 1 && (r.period - 1) % 12 === 0){
    tr.classList.add('year-start');
  }

  tr.innerHTML =
    '<td>' + r.period + '</td>' +
    '<td>' + r.date + '</td>' +
    '<td>' + Math.round(r.monthPay).toLocaleString() + '</td>' +
    '<td>' + Math.round(r.pri).toLocaleString() + '</td>' +
    '<td>' + Math.round(r.int).toLocaleString() + '</td>' +
    '<td>' + Math.round(r.bal).toLocaleString() + '</td>';

  tbody.appendChild(tr);
}

async function copyTip(){
  const btn = document.getElementById('copyBtn');
  try{
    await navigator.clipboard.writeText(tipContent);
    const oldText = btn.innerText;
    btn.innerText = '已複製';
    setTimeout(function(){ btn.innerText = oldText; }, 1200);
  }catch(e){}
}

function openWinSnipping(){
  const btn = document.getElementById('snapBtn');
  const oldText = btn.innerText;
  btn.innerText = '已開啟截圖';
  setTimeout(function(){ btn.innerText = oldText; }, 1200);
}

function backToInput(){
  lastCalc = null;
  tipContent = '';
  showAll = false;
  document.querySelector('.input-area').style.display = 'block';
  document.getElementById('resultBlock').style.display = 'none';
  window.scrollTo(0, 0);
}

function clearAll(){
  document.getElementById('principal').value = '';
  document.getElementById('loanYear').value = '';
  // 清除時重新帶回當前年月，不要清空
  const now = new Date();
  const yy = now.getFullYear() - 1911;
  const mm = now.getMonth() + 1;
  document.getElementById('rocYear').value = yy;
  document.getElementById('rocMonth').value = mm;
  document.getElementById('rate').value = '';
  lastCalc = null;
  tipContent = '';
  showAll = false;
  document.querySelector('.input-area').style.display = 'block';
  document.getElementById('resultBlock').style.display = 'none';
}
</script>
</body>
</html>
