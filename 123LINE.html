
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 貸款對話模擬器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft JhengHei",sans-serif;}
body{background:#f5f6f8;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
.top-bar{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.top-bar h3{font-size:16px;color:#222;margin-right:8px;}
.role-btn{padding:7px 16px;border-radius:20px;border:1px solid #ccd0d5;cursor:pointer;font-size:14px;background:#fff;transition:all .2s;}
.role-btn.active{background:#06c755;color:#fff;border-color:#06c755;font-weight:bold;}
.ctrl-group{margin-left:auto;display:flex;gap:8px;}
.ctrl-btn{padding:6px 12px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-size:13px;}
.main-wrap{flex:1;display:flex;overflow:hidden;}
.chat-area{flex:1;display:flex;flex-direction:column;background:#f7f8fa;}
.chat-header{background:#fff;padding:14px 18px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:10px;}
.chat-header .avatar{width:36px;height:36px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer;}
.chat-header .avatar img{width:100%;height:100%;object-fit:cover;}
.chat-header .name{font-size:17px;font-weight:bold;color:#222;}
.speaker-icon{font-size:16px;color:#777;}
.header-btns{margin-left:auto;display:flex;gap:8px;}
.h-btn{padding:6px 12px;border:1px solid #d0d3d8;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:4px;}
.chat-scroll{flex:1;overflow-y:auto;overflow-x:auto;padding:20px 24px;display:flex;flex-direction:column;gap:14px;}
.date-divider{align-self:center;background:#dcdfe3;color:#555;padding:6px 18px;border-radius:20px;font-size:14px;margin:8px 0;}
.msg-row{display:flex;gap:8px;align-items:flex-end;position:relative;}
.msg-row.right{flex-direction:row-reverse;}
.msg-avatar{width:32px;height:32px;border-radius:50%;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;}
.msg-avatar img{width:100%;height:100%;object-fit:cover;}
.bubble-wrap{display:flex;flex-direction:column;max-width:calc(30em + 28px);width:fit-content;}
.msg-row.right .bubble-wrap{align-items:flex-end;}
.bubble{display:inline-block;width:fit-content;max-width:100%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;cursor:pointer;}
.bubble-line{display:block;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;}
.msg-row.left .bubble{background:#ffffff;border:1px solid #e4e6e8;border-bottom-left-radius:4px;}
.msg-row.right .bubble{background:#c8f0c8;border-bottom-right-radius:4px;}
.sys-notice{align-self:center;background:#dcdfe3;color:#555;padding:10px 24px;border-radius:16px;text-align:center;font-size:14px;}
.time-label{font-size:11px;color:#888;margin-top:4px;}
.msg-menu{position:absolute;background:#fff;border:1px solid #ddd;border-radius:8px;box-shadow:0 3px 10px #0002;z-index:99;display:none;min-width:110px;}
.msg-menu button{width:100%;padding:8px 12px;border:none;background:none;text-align:left;font-size:14px;cursor:pointer;}
.msg-menu button:hover{background:#f0f2f5;}
.input-bar{background:#fff;border-top:1px solid #e5e7eb;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.input-bar textarea{flex:1;min-width:220px;border:1px solid #d6d9dd;border-radius:8px;padding:10px;font-size:14px;resize:none;height:44px;outline:none;}
.datetime-wrap{display:flex;align-items:center;gap:4px;font-size:13px;color:#444;}
.datetime-wrap input{width:46px;padding:7px;border:1px solid #d6d9dd;border-radius:6px;font-size:14px;text-align:center;}
.send-btn{background:#06c755;color:white;border:none;padding:10px 22px;border-radius:8px;font-size:15px;cursor:pointer;font-weight:bold;}
.side-panel{width:280px;background:#fff;border-left:1px solid #e5e7eb;display:flex;flex-direction:column;overflow-y:auto;}
.side-profile{padding:18px;border-bottom:1px solid #eee;}
.side-profile .big-avatar{width:64px;height:64px;border-radius:50%;overflow:hidden;margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;}
.side-profile .big-avatar img{width:100%;height:100%;object-fit:cover;}
.side-profile .pname{font-size:19px;font-weight:bold;}
.tag-line{margin-top:14px;color:#22c55e;font-size:14px;cursor:pointer;}
.owner-line{margin-top:16px;font-size:14px;color:#444;display:flex;align-items:center;gap:8px;}
.notes-title{padding:14px 18px;font-size:16px;font-weight:bold;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;}
.notes-box{padding:16px;}
.notes-box textarea{width:100%;min-height:260px;border:1px solid #e0e0e0;border-radius:6px;padding:10px;font-size:14px;line-height:1.6;resize:vertical;outline:none;}
.note-meta{margin-top:10px;font-size:12px;color:#888;}
.hidden-file{display:none;}
</style>
</head>
<body>
<div class="top-bar">
  <h3>角色切換：</h3>
  <button class="role-btn active" id="roleAgent">業務(我方)</button>
  <button class="role-btn" id="roleClient">客人</button>
  <div class="ctrl-group">
    <button class="ctrl-btn" onclick="clearAll()">清空對話</button>
    <button class="ctrl-btn" onclick="renameClient()">修改客人名字</button>
    <button class="ctrl-btn" onclick="document.getElementById('avatarFile').click()">更換頭像</button>
    <input type="file" id="avatarFile" class="hidden-file" accept="image/*">
  </div>
</div>

<div class="main-wrap">
  <div class="chat-area">
    <div class="chat-header">
      <div class="avatar" id="chatHeaderAvatar">🐱</div>
      <div class="name" id="chatHeaderName">Kun (胖8.25)</div>
      <span class="speaker-icon">🔊</span>
      <div class="header-btns">
        <button class="h-btn">待處理</button>
        <button class="h-btn">處理完畢</button>
        <button class="h-btn">搜尋</button>
      </div>
    </div>
    <div class="chat-scroll" id="chatBox"></div>
    <div class="input-bar">
      <textarea id="msgInput" placeholder="Enter 傳送 / Shift + Enter 換行"></textarea>
      <div class="datetime-wrap">
        <span>月</span><input type="text" id="mInput" value="08">
        <span>日</span><input type="text" id="dInput" value="25">
        <span>時</span><input type="text" id="hInput" value="19">
        <span>分</span><input type="text" id="minInput" value="56">
      </div>
      <button class="send-btn" onclick="sendMessage()">傳送</button>
    </div>
  </div>

  <div class="side-panel">
    <div class="side-profile">
      <div class="big-avatar" id="sideBigAvatar">🐱</div>
      <div class="pname" id="sidePName">Kun (胖8.25)</div>
      <div class="tag-line">＋新增標籤</div>
      <div class="owner-line">負責人員　高啟文(小胖)</div>
    </div>
    <div class="notes-title">記事本 1/1 <span style="color:#22c55e">＋</span></div>
    <div class="notes-box">
      <textarea id="noteBox">姓名：黃巳坤
年齡：22
居住地：新北市
LINE ID：jerry4999
手機號碼：0981021949
需求金額：30萬 - 50萬
身分證字號：F131541210
銀行警示戶：否
個人外幣帳戶：是
信貸/房貸/汽貸/機車：無 121</textarea>
      <div class="note-meta">2026/8/25 19:59 Unknown</div>
    </div>
  </div>
</div>

<div class="msg-menu" id="msgMenu">
  <button onclick="editMsg()">✏️ 編輯</button>
  <button onclick="delMsg()">🗑️ 刪除</button>
</div>

<script>
let currentRole = "agent";
let clientName = "Kun (胖8.25)";
let avatarImgSrc = null;
let activeMsgRow = null;
let lastDateLabel = null;

const roleAgentBtn = document.getElementById("roleAgent");
const roleClientBtn = document.getElementById("roleClient");
const chatBox = document.getElementById("chatBox");
const msgInput = document.getElementById("msgInput");
const mInput = document.getElementById("mInput");
const dInput = document.getElementById("dInput");
const hInput = document.getElementById("hInput");
const minInput = document.getElementById("minInput");
const chatHeaderName = document.getElementById("chatHeaderName");
const sidePName = document.getElementById("sidePName");
const chatHeaderAvatar = document.getElementById("chatHeaderAvatar");
const sideBigAvatar = document.getElementById("sideBigAvatar");
const avatarFile = document.getElementById("avatarFile");
const msgMenu = document.getElementById("msgMenu");

roleAgentBtn.onclick = ()=>switchRole("agent");
roleClientBtn.onclick = ()=>switchRole("client");

function switchRole(role){
  currentRole = role;
  roleAgentBtn.classList.toggle("active", role==="agent");
  roleClientBtn.classList.toggle("active", role==="client");
  msgInput.focus();
}

function renameClient(){
  const newName = prompt("請輸入新的客人名稱：", clientName);
  if(newName && newName.trim()){
    clientName = newName.trim();
    chatHeaderName.innerText = clientName;
    sidePName.innerText = clientName;
  }
}

avatarFile.onchange = function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    avatarImgSrc = ev.target.result;
    chatHeaderAvatar.innerHTML = `<img src="${avatarImgSrc}">`;
    sideBigAvatar.innerHTML = `<img src="${avatarImgSrc}">`;
  }
  reader.readAsDataURL(file);
}

function getWeekday(month, day){
  const date = new Date(2026, month-1, day);
  const weekArr = ["日","一","二","三","四","五","六"];
  return weekArr[date.getDay()];
}

function sendMessage(){
  const txt = msgInput.value;
  if(!txt.trim()) return;
  const m = mInput.value.padStart(2,"0");
  const d = dInput.value.padStart(2,"0");
  const hh = hInput.value.padStart(2,"0");
  const mm = minInput.value.padStart(2,"0");
  const week = getWeekday(Number(m), Number(d));
  const dateLabel = `${Number(m)}/${Number(d)} (${week})`;
  const timeStr = `${hh}:${mm}`;
  addMessage(txt, currentRole, timeStr, dateLabel);
  msgInput.value = "";
  msgInput.focus();
}

function wrapTextByChars(text, maxChars){
  return text.split("\n").map(segment => {
    if(segment.length <= maxChars) return segment;
    const lines = [];
    for(let i = 0; i < segment.length; i += maxChars){
      lines.push(segment.slice(i, i + maxChars));
    }
    return lines.join("\n");
  }).join("\n");
}

function addMessage(text, role, timeStr, dateLabel){
  if(lastDateLabel !== dateLabel){
    const divider = document.createElement("div");
    divider.className = "date-divider";
    divider.innerText = dateLabel;
    chatBox.appendChild(divider);
    lastDateLabel = dateLabel;
  }

  const row = document.createElement("div");
  row.className = "msg-row " + (role==="agent" ? "right" : "left");
  const avatar = document.createElement("div");
  avatar.className = "msg-avatar";
  if(role === "client"){
    if(avatarImgSrc){
      avatar.innerHTML = `<img src="${avatarImgSrc}">`;
    }else{
      avatar.innerText = "🐱";
    }
  }else{
    avatar.innerText = "👤";
  }
  const bubbleWrap = document.createElement("div");
  bubbleWrap.className = "bubble-wrap";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.dataset.rawText = text;
  renderBubbleText(bubble, text);

  bubble.onclick = function(ev){
    ev.stopPropagation();
    activeMsgRow = row;
    msgMenu.style.display = "block";
    msgMenu.style.left = ev.clientX + "px";
    msgMenu.style.top = ev.clientY + "px";
  }

  const timeLbl = document.createElement("div");
  timeLbl.className = "time-label";
  timeLbl.innerText = timeStr;
  bubbleWrap.appendChild(bubble);
  bubbleWrap.appendChild(timeLbl);
  row.appendChild(avatar);
  row.appendChild(bubbleWrap);
  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function renderBubbleText(bubble, text){
  bubble.innerHTML = "";
  wrapTextByChars(text, 30).split("\n").forEach(line => {
    const lineEl = document.createElement("span");
    lineEl.className = "bubble-line";
    lineEl.textContent = line;
    bubble.appendChild(lineEl);
  });
}

function editMsg(){
  if(!activeMsgRow) return;
  const bubble = activeMsgRow.querySelector(".bubble");
  const oldText = bubble.dataset.rawText || bubble.innerText;
  const newText = prompt("編輯訊息：", oldText);
  if(newText !== null){
    bubble.dataset.rawText = newText;
    renderBubbleText(bubble, newText);
  }
  msgMenu.style.display = "none";
  activeMsgRow = null;
}

function delMsg(){
  if(!activeMsgRow) return;
  if(!confirm("確定刪除這則訊息？")){
    msgMenu.style.display = "none";
    activeMsgRow = null;
    return;
  }
  activeMsgRow.remove();
  msgMenu.style.display = "none";
  activeMsgRow = null;
}

document.addEventListener("click", function(){
  msgMenu.style.display = "none";
  activeMsgRow = null;
});

function addSystemNotice(timeStr, text){
  const notice = document.createElement("div");
  notice.className = "sys-notice";
  notice.innerHTML = `<div style="font-weight:bold">${timeStr}</div><div>${text}</div>`;
  chatBox.appendChild(notice);
  chatBox.scrollTop = chatBox.scrollHeight;
}

const initDateLabel = "8/25 (二)";
const divider = document.createElement("div");
divider.className = "date-divider";
divider.innerText = initDateLabel;
chatBox.appendChild(divider);
lastDateLabel = initDateLabel;
addSystemNotice("19:56","用户已將您加入好友!");
addMessage("我是立順投資有限公司\n您好Kun\n感謝您加入好友✨✨✨\n\n請提供您的：姓名\n方便貸款專員協助您辦理流程喔🀄🀄🀄","agent","19:56");
addMessage("黃巳坤","client","19:56");

msgInput.addEventListener("keydown", e=>{
  if(e.key==="Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});

function clearAll(){
  if(!confirm("確定清空全部對話嗎？")) return;
  chatBox.innerHTML = "";
  lastDateLabel = null;
}
</script>
</body>
</html>
