<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LINE 對話模擬器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2306C755'/%3E%3Cpath d='M16 7c-5.5 0-10 3.6-10 8 0 2.5 1.4 4.7 3.6 6.2v3.6l3.4-1.9c1 .3 2 .4 3 .4 5.5 0 10-3.6 10-8S21.5 7 16 7z' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --green:#06C755;
  --green-dark:#05b04c;
  --bubble-mine:#B7EFCE;
  --bubble-them:#EFF1F2;
  --line:#E9E9E9;
  --line-soft:#F0F0F0;
  --txt:#111;
  --txt-2:#666;
  --txt-3:#9A9A9A;
  --side-bg:#FFFFFF;
  --page:#EDEDED;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei","Helvetica Neue",sans-serif;
  font-size:14px;color:var(--txt);background:var(--page);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}

.app{
  display:flex;height:100vh;height:100dvh;max-width:1360px;margin:0 auto;
  background:#fff;box-shadow:0 0 40px rgba(0,0,0,.10);position:relative;overflow:hidden;
}

/* ================= 左：聊天區 ================= */
.chat{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;container-type:inline-size}

/* ============ 頂部：尺寸依聊天區寬度等比縮放（基準 4096px＝截圖原寸） ============ */
.role-bar{
  flex:0 0 auto;display:flex;align-items:flex-start;justify-content:flex-start;
  column-gap:clamp(10px,1.4cqw,18px);row-gap:clamp(8px,1cqw,12px);flex-wrap:wrap;
  padding:clamp(9px,1.07cqw,15px) clamp(12px,2.4cqw,26px) 0;
  background:#fff;
}
.seg{display:flex;gap:clamp(8px,1.44cqw,16px);max-width:100%;flex-wrap:wrap}
.seg button{
  display:inline-flex;align-items:center;justify-content:center;
  height:clamp(30px,3.73cqw,44px);
  padding:0 clamp(10px,1.1cqw,15px);
  border-radius:999px;
  font-size:clamp(12.5px,1.95cqw,22px);line-height:1;color:#2E2E2E;
  background:#fff;border:1px solid #CFCFD2;
  white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
}
.seg button .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button.active{background:var(--green);color:#fff;border-color:var(--green);font-weight:600}
.seg button.active:hover{border-color:var(--green)}

/* 右側三顆操作鈕（與膠囊同一列） */
.ops{
  margin-left:auto;display:flex;align-items:center;justify-content:flex-end;
  gap:clamp(7px,1.2cqw,14px);flex-wrap:nowrap;flex:0 0 auto;
}
.hbtn{
  display:inline-flex;align-items:center;justify-content:center;
  gap:clamp(6px,0.9cqw,10px);
  height:clamp(30px,3.95cqw,45px);
  padding:0 clamp(9px,1.5cqw,16px);
  border-radius:clamp(7px,0.72cqw,10px);
  border:1px solid #BDBDC2;background:#fff;color:#4F4F4F;
  font-size:clamp(12px,1.62cqw,18px);line-height:1;white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.hbtn svg,.hbtn img{height:clamp(14px,1.55cqw,18px);width:auto;flex:0 0 auto;display:block}
.hbtn img{opacity:.92}
.hbtn.on img{opacity:1}
.hbtn:hover{background:#F8F8F8;border-color:#A9A9AE;color:#222}
.hbtn.on{border-color:var(--green);color:#1E8F4C;background:#F3FCF7}
.hbtn.on svg{color:#1E8F4C}

/* 聊天室標題列（頭像 + 客人名稱 + 喇叭） */
.chat-head{
  position:relative;flex:0 0 auto;display:flex;align-items:center;
  gap:clamp(10px,1.44cqw,17px);
  padding:clamp(12px,2.68cqw,30px) clamp(12px,2.4cqw,26px) clamp(7px,0.7cqw,9px);
  border-bottom:1px solid #EDEDED;
}
.head-avatar{
  width:clamp(34px,4.6cqw,52px);height:clamp(34px,4.6cqw,52px);
  border-radius:50%;overflow:hidden;flex:0 0 auto;background:#DFE3E6;
}
.head-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.head-name{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.head-name .n{
  display:flex;align-items:center;gap:clamp(3px,0.5cqw,6px);min-width:0;
  font-size:clamp(17px,2.3cqw,26px);font-weight:500;line-height:1.28;color:#111;
  white-space:nowrap;
}
.head-name .n .nm{overflow:hidden;text-overflow:ellipsis}
.head-name .n .st{overflow:hidden;text-overflow:ellipsis;margin-left:clamp(5px,0.9cqw,10px)}
.head-name .s{font-size:11.5px;color:var(--txt-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.speaker{
  width:clamp(20px,2.4cqw,27px);height:clamp(20px,2.4cqw,27px);
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  color:#6B6B6B;border-radius:5px;margin-left:clamp(5px,0.9cqw,10px);
}
.speaker:hover{background:#F3F3F3;color:#3C3C3C}
.speaker svg{width:clamp(16px,1.95cqw,22px);height:clamp(16px,1.95cqw,22px)}

/* 設定 / 資料欄：平時隱藏，滑過標題列才出現，保持畫面乾淨 */
.head-tools{
  display:flex;align-items:center;gap:1px;opacity:0;transition:opacity .18s;
}
.chat-head:hover .head-tools,.head-tools:focus-within{opacity:1}
.icon-btn{
  width:clamp(30px,3.24cqw,36px);height:clamp(30px,3.24cqw,36px);
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  color:#8C8C8C;transition:background .15s;flex:0 0 auto;
}
.icon-btn:hover{background:#F3F3F3;color:#555}
.icon-btn:active{background:#E9E9E9}
.icon-btn svg{width:19px;height:19px;display:block}
.icon-btn.on{color:var(--green)}

/* 訊息區 */
.chat-body{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:14px 14px 6px;background:#fff;scroll-behavior:smooth;
}
.chat-body::-webkit-scrollbar{width:9px}
.chat-body::-webkit-scrollbar-thumb{background:#DDD;border-radius:9px}
.chat-body::-webkit-scrollbar-track{background:transparent}

.day{display:flex;justify-content:center;margin:16px 0 14px}
.day span{
  background:#EDEDED;color:#8B8B8B;font-size:11.5px;padding:4px 14px;border-radius:999px;letter-spacing:.02em;
}
.day:first-child{margin-top:2px}

.row{display:flex;align-items:flex-end;gap:6px;margin-bottom:12px}
.row.mine{justify-content:flex-start}
.row.them{justify-content:flex-end}
.bubble{
  max-width:min(76%,520px);padding:9px 12px;font-size:14px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  box-shadow:0 1px 0 rgba(0,0,0,.03);
}
.row.mine .bubble{background:var(--bubble-mine);border-radius:14px;border-top-left-radius:5px}
.row.them .bubble{background:var(--bubble-them);border-radius:14px;border-top-right-radius:5px}
.bubble.media{padding:4px;background:#fff!important;border:1px solid #E4E4E4}
.bubble.media img{display:block;max-width:230px;width:100%;border-radius:11px;cursor:zoom-in}
.bubble.media.mine-img{background:var(--bubble-mine)!important;border-color:transparent;padding:5px}

.stamp{display:flex;flex-direction:column;margin-top:3px;font-size:11px;color:#A6A6A6;gap:2px}
.row.mine .stamp{align-items:flex-start;padding-left:2px}
.row.them .stamp{align-items:flex-end;padding-right:2px}
.del{
  width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid #E2E2E2;color:#9A9A9A;
  display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;flex:0 0 auto;margin-bottom:16px;
}
.del svg{width:12px;height:12px}
.row:hover .del{opacity:1}
.del:hover{color:#E4573D;border-color:#F0C9C2}

.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:#B5B5B5;font-size:13px;text-align:center;line-height:1.7}

/* 輸入區 */
.composer{flex:0 0 auto;border-top:1px solid var(--line);padding:8px 10px 10px;background:#fff}
.compose-main{display:flex;align-items:flex-end;gap:8px}
.compose-main textarea{
  flex:1;min-width:0;border:0;outline:none;resize:none;background:#fff;
  font-size:16px;line-height:1.5;padding:9px 6px 8px;max-height:120px;min-height:42px;
}
.compose-main textarea::placeholder{color:#B4B4B4;font-size:13.5px}
.send{
  flex:0 0 auto;height:38px;min-width:88px;padding:0 12px;background:var(--green);color:#fff;
  border-radius:6px;font-size:13.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;
  transition:background .15s;
}
.send:hover{background:var(--green-dark)}
.send:disabled{background:#C9EAD6;cursor:not-allowed;color:#fff}
.send svg{width:13px;height:13px;opacity:.9}
.compose-tools{display:flex;align-items:center;gap:2px;margin-top:2px}
.tool{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#9E9E9E}
.tool:hover{background:#F4F4F4;color:#555}
.tool svg{width:19px;height:19px}
.hint{margin-left:auto;font-size:11px;color:#B7B7B7;letter-spacing:.01em;white-space:nowrap}

/* ================= 右：資料欄 ================= */
.side{
  flex:0 0 300px;width:300px;border-left:1px solid var(--line);background:var(--side-bg);
  padding:16px 16px 24px;overflow-y:auto;
}
.side.hide{display:none}
.contact{display:flex;align-items:flex-start;gap:11px;margin-bottom:16px}
.contact .av{width:54px;height:54px;border-radius:50%;overflow:hidden;background:#DFE3E6;flex:0 0 auto}
.contact .av img{width:100%;height:100%;object-fit:cover;display:block}
.contact .meta{min-width:0;flex:1;padding-top:4px}
.contact .meta .n{font-size:15px;font-weight:600;line-height:1.35;word-break:break-word}
.contact .meta .s{font-size:12px;color:var(--txt-3);margin-top:3px;line-height:1.4;word-break:break-word}
.pencil{width:30px;height:30px;border-radius:7px;color:var(--green);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.pencil:hover{background:#EDFBF3}
.pencil svg{width:16px;height:16px}

.tags-empty{
  border:1px solid #E6E6E6;border-radius:8px;background:#FAFAFA;color:#9E9E9E;font-size:12.5px;
  padding:11px 12px;line-height:1.5;margin-bottom:10px;
}
.tag-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{
  display:inline-flex;align-items:center;gap:5px;background:#F2F6F4;color:#2F7A52;border:1px solid #D9EBE1;
  border-radius:999px;font-size:12px;padding:4px 8px 4px 10px;
}
.tag b{font-weight:500}
.tag button{color:#8FB3A1;width:14px;height:14px;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
.tag button:hover{color:#E4573D}
.add-link{display:inline-flex;align-items:center;gap:4px;color:var(--green);font-size:12.5px;font-weight:600;padding:4px 2px}
.add-link:hover{opacity:.8}

.sec{margin-top:20px}
.sec-head{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#8F8F8F;margin-bottom:9px}
.sec-head .t{font-size:13px;color:#444;font-weight:600}
.sec-head .num{font-size:11.5px;color:#B0B0B0}
.sec-head .right{margin-left:auto;display:flex;align-items:center;gap:6px}
.plus{width:26px;height:26px;border-radius:6px;color:var(--green);font-size:17px;display:flex;align-items:center;justify-content:center;line-height:1}
.plus:hover{background:#EDFBF3}

.owner{display:flex;align-items:center;gap:9px;padding:6px 0}
.owner .av{width:34px;height:34px;border-radius:50%;background:#EFEFEF;display:flex;align-items:center;justify-content:center;color:#B9B9B9;flex:0 0 auto}
.owner .av svg{width:19px;height:19px}
.owner .nm{font-size:13.5px;color:#333;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.note{
  border:1px solid #E6E6E6;border-radius:8px;padding:13px 13px 10px;background:#fff;
}
.note-txt{
  outline:none;font-size:13px;line-height:1.95;color:#333;white-space:pre-wrap;word-break:break-word;
  min-height:40px;
}
.note-txt:focus{background:#FCFDFB;box-shadow:inset 0 0 0 1px #DFF2E6;border-radius:4px}
.note-foot{display:flex;align-items:center;gap:8px;margin-top:9px;padding-top:8px;border-top:1px dashed #EFEFEF;color:#B6B6B6;font-size:11px}
.note-foot .r{margin-left:auto;display:flex;gap:2px}
.note-foot button{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#C0C0C0}
.note-foot button:hover{background:#F5F5F5;color:#777}
.note-foot svg{width:14px;height:14px}

/* ============ 設定面板 ============ */
.mask{
  position:fixed;inset:0;background:rgba(20,24,22,.42);display:none;align-items:center;justify-content:center;
  padding:16px;z-index:40;backdrop-filter:blur(2px)
}
.mask.show{display:flex}
.panel{
  width:100%;max-width:460px;max-height:88vh;overflow-y:auto;background:#fff;border-radius:14px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
}
.panel-head{
  display:flex;align-items:center;gap:8px;padding:15px 18px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff;z-index:2;border-radius:14px 14px 0 0;
}
.panel-head .h{font-size:15px;font-weight:600;flex:1}
.panel-head .x{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999}
.panel-head .x:hover{background:#F4F4F4}
.panel-body{padding:16px 18px 20px}
.grp{margin-bottom:18px}
.grp > .lb{font-size:12px;color:#8C8C8C;margin-bottom:7px;display:block;letter-spacing:.02em}
.field{display:flex;align-items:center;gap:8px}
.field input[type=text],.field input[type=url]{
  width:100%;min-width:0;border:1px solid #E2E2E2;border-radius:8px;padding:10px 11px;font-size:14px;outline:none;background:#fff;
}
.field input:focus{border-color:#9BDFB8;box-shadow:0 0 0 3px #EAF8F0}
.ava-row{display:flex;align-items:center;gap:13px}
.ava-prev{width:62px;height:62px;border-radius:50%;overflow:hidden;background:#E8ECEF;flex:0 0 auto;position:relative}
.ava-prev img{width:100%;height:100%;object-fit:cover;display:block}
.upload{
  display:inline-flex;align-items:center;gap:6px;border:1px solid #DCDCDC;border-radius:8px;padding:8px 12px;
  font-size:13px;color:#444;background:#fff;cursor:pointer
}
.upload:hover{border-color:#B7E6C9;background:#F7FDF9}
.upload svg{width:15px;height:15px;color:var(--green)}
.mini-note{font-size:11.5px;color:#ADADAD;margin-top:8px;line-height:1.6}
.switch-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F3F3F3}
.switch-row:last-of-type{border-bottom:0}
.switch-row .tx{flex:1;font-size:13.5px;color:#333}
.switch-row .dx{font-size:11.5px;color:#A8A8A8;display:block;margin-top:2px}
.toggle{width:42px;height:24px;border-radius:999px;background:#DDD;position:relative;flex:0 0 auto;transition:background .18s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--green)}
.toggle.on::after{left:21px}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.btn{border:1px solid #E0E0E0;border-radius:8px;padding:9px 13px;font-size:13px;color:#444;background:#fff}
.btn:hover{background:#F7F7F7}
.btn.green{border-color:var(--green);color:var(--green)}
.btn.danger{border-color:#F0C9C2;color:#D9503A}
.btn.danger:hover{background:#FDF4F2}

/* 放大圖 */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.lightbox.show{display:flex}
.lightbox img{max-width:92vw;max-height:88vh;border-radius:8px}

/* toast */
.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);
  background:rgba(30,32,31,.92);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:86vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 預覽模式（隱藏模擬列） */
body.pure .role-bar{display:none}

/* 搜尋命中提示 */
.row.flash .bubble{animation:flashBubble 1.4s ease}
@keyframes flashBubble{
  0%,100%{box-shadow:0 0 0 0 rgba(6,199,85,0)}
  35%{box-shadow:0 0 0 3px rgba(6,199,85,.55)}
}

/* ================= 手機 / 窄屏 ================= */
@media (max-width:859px){
  .app{max-width:none;box-shadow:none}
  .side{
    position:absolute;top:0;right:0;bottom:0;width:min(88vw,320px);flex-basis:auto;z-index:30;
    box-shadow:-14px 0 40px rgba(0,0,0,.16);display:none;
  }
  .side.open{display:block}
  .hint{display:none}
  .seg button{max-width:42vw}
  .bubble{max-width:82%}
}
@media (max-width:860px){
  .head-tools{opacity:1}
}
@media (max-width:760px){
  .role-bar{padding-bottom:4px}
  .seg{gap:8px}
  .seg button{height:32px;font-size:13px;padding:0 13px}
  .chat-head{flex-wrap:wrap;row-gap:9px;padding-top:12px}
  .head-name{flex:1 1 auto}
  .ops{width:100%;margin-left:0;justify-content:flex-start;gap:7px}
  .ops .hbtn{flex:1 1 0;padding:0 8px;height:34px;font-size:13px}
  .ops .hbtn svg{width:14px;height:14px}
}
@media (min-width:860px){
  .side{display:block}
  .side.hide{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">

  <section class="chat">
    <div class="role-bar" id="roleBar">
      <div class="seg" id="seg">
        <button data-role="me"><span class="tx" id="segMe">我（業務）發訊</span></button>
        <button data-role="them"><span class="tx" id="segThem">客人發訊</span></button>
      </div>
    </div>

    <header class="chat-head">
      <div class="head-avatar"><img id="headAvatar" alt=""></div>
      <div class="head-name">
        <div class="n">
          <span class="nm" id="headName">黃惠玲</span>
          <span class="st" id="headStatus">已經撥款70萬</span>
          <button class="speaker" data-toast="語音訊息為模擬畫面，未提供實際功能" title="語音" aria-label="語音訊息">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 9.5v5h3.2L12 19V5l-4.8 4.5H4z" fill="currentColor" stroke="none"/><path d="M15.4 8.6a4.6 4.6 0 010 6.8" stroke-width="1.9"/><path d="M18.2 6a8.4 8.4 0 010 12" stroke-width="1.9"/></svg>
          </button>
        </div>
        <div class="s" id="headSub"></div>
      </div>

      state = Object.assign(state, s);
      if(!state.them.avatar) state.them.avatar = CAT;
      if(typeof state.them.status !== 'string') state.them.status = '已經撥款70萬';
      if(!state.notes.length) state.notes = [{ text:'', ts:'', by:'' }];
    }catch(e){}
  }
  let saveTimer = null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
    }, 120);
  }

  const $ = function(id){ return document.getElementById(id); };
  const el = {
    body:$('chatBody'), headAvatar:$('headAvatar'), headName:$('headName'), headStatus:$('headStatus'), headSub:$('headSub'),
    side:$('side'), sideAvatar:$('sideAvatar'), sideName:$('sideName'), sideSub:$('sideSub'),
    seg:$('seg'), segMe:$('segMe'), segThem:$('segThem'), input:$('input'), btnSend:$('btnSend'),
    noteList:$('noteList'), noteNum:$('noteNum'), tagWrap:$('tagWrap'), ownerName:$('ownerName'),
    mask:$('mask'), toast:$('toast'), lightbox:$('lightbox'), lightboxImg:$('lightboxImg'),
    prevThem:$('prevThem')
  };

  let toastTimer = null;
  function toast(msg){
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.toast.classList.remove('show'); }, 1900);
  }

  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function clock(ts){ const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
  function dayKey(ts){ const d = new Date(ts); return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate(); }
  function dayLabel(ts){ const d = new Date(ts); return (d.getMonth()+1) + '/' + d.getDate() + ' (' + WK[d.getDay()] + ')'; }

  /* ---------- 渲染：聊天 ---------- */
  function renderChat(){
    const frag = document.createDocumentFragment();
    if(!state.messages.length){
      const e = document.createElement('div');
      e.className = 'empty';
      e.innerHTML = '<div>還沒有任何訊息</div><div>在下方輸入框開始對話，或到設定載入範例對話</div>';
      frag.appendChild(e);
    }
    let lastDay = null;
    state.messages.forEach(function(m){
      const dk = dayKey(m.ts);
      if(dk !== lastDay){
        lastDay = dk;
        const day = document.createElement('div');
        day.className = 'day';
        const pill = document.createElement('span');
        pill.textContent = dayLabel(m.ts);
        day.appendChild(pill);
        frag.appendChild(day);
      }
      frag.appendChild(bubbleRow(m));
    });
    el.body.innerHTML = '';
    el.body.appendChild(frag);
    el.body.scrollTop = el.body.scrollHeight;
  }

  function bubbleRow(m){
    const row = document.createElement('div');
    row.className = 'row ' + (m.side === 'me' ? 'mine' : 'them');
    row.dataset.mid = m.id;

    const del = document.createElement('button');
    del.className = 'del';
    del.title = '刪除這則訊息';
    del.setAttribute('aria-label','刪除這則訊息');
    del.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>';
    del.addEventListener('click', function(){
      state.messages = state.messages.filter(function(x){ return x.id !== m.id; });
      save(); renderChat();
    });

    const wrap = document.createElement('div');
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';

    const b = document.createElement('div');
    b.className = 'bubble';

    if(m.type === 'image' && m.img){
      b.className += ' media' + (m.side === 'me' ? ' mine-img' : '');
      const im = document.createElement('img');
      im.src = m.img;
      im.alt = '傳送的圖片';
      im.addEventListener('click', function(){
        el.lightboxImg.src = m.img;
        el.lightbox.classList.add('show');
      });
      b.appendChild(im);
    }else{
      b.textContent = m.text || '';
    }

    const stamp = document.createElement('div');
    stamp.className = 'stamp';
    const t = document.createElement('span');
    t.textContent = clock(m.ts);
    stamp.appendChild(t);

    wrap.appendChild(b);
    wrap.appendChild(stamp);

    if(m.side === 'me'){ row.appendChild(wrap); row.appendChild(del); }
    else { row.appendChild(del); row.appendChild(wrap); }
    return row;
  }

  /* ---------- 渲染：頭像 / 名稱 / 身分 ---------- */
  function renderIdentity(){
    el.headAvatar.src = state.them.avatar;
    el.sideAvatar.src = state.them.avatar;
    el.prevThem.src = state.them.avatar;
    el.headName.textContent = state.them.name;
    el.headStatus.textContent = state.them.status || '';
    el.headStatus.style.display = state.them.status ? 'inline' : 'none';
    el.sideName.textContent = state.them.name;
    el.headSub.textContent = state.them.sub || '';
    el.sideSub.textContent = state.them.sub || '';
    el.sideSub.style.display = state.them.sub ? 'block' : 'none';
    el.headSub.style.display = state.them.sub ? 'block' : 'none';

    el.segMe.title = '以「' + (state.me.name || '我') + '」的身分發訊';
    el.segThem.title = '以「' + (state.them.name || '客人') + '」的身分發訊';
    Array.prototype.forEach.call(el.seg.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.dataset.role === state.role);
    });
    el.ownerName.textContent = state.owner || '—';
    el.input.placeholder = state.role === 'me'
      ? '以「' + (state.me.name || '我') + '」的身分傳送訊息'
      : '以「' + (state.them.name || '客人') + '」的身分傳送訊息';
  }

  /* ---------- 渲染：標籤 ---------- */
  function renderTags(){
    el.tagWrap.innerHTML = '';
    if(!state.tags.length){
      const d = document.createElement('div');
      d.className = 'tags-empty';
      d.textContent = '試著使用標籤將聊天室分類吧。';
      el.tagWrap.appendChild(d);
    }else{
      const list = document.createElement('div');
      list.className = 'tag-list';
      state.tags.forEach(function(t, i){
        const tag = document.createElement('span');
        tag.className = 'tag';
        const nm = document.createElement('b');
        nm.textContent = t;
        const x = document.createElement('button');
        x.type = 'button';
        x.setAttribute('aria-label','移除標籤');
        x.textContent = '×';
        x.addEventListener('click', function(){
          state.tags.splice(i,1); save(); renderTags();
        });
        tag.appendChild(nm); tag.appendChild(x);
        list.appendChild(tag);
      });
      el.tagWrap.appendChild(list);
    }
    const add = document.createElement('button');
    add.className = 'add-link';
    add.innerHTML = '＋ 新增標籤';
    add.addEventListener('click', function(){
      const v = prompt('新增標籤名稱（例如：待撥款、已成交）');
      if(v && v.trim()){ state.tags.push(v.trim().slice(0,12)); save(); renderTags(); }
    });
    el.tagWrap.appendChild(add);
  }

  /* ---------- 渲染：記事本 ---------- */
  function renderNotes(){
    el.noteList.innerHTML = '';
    state.notes.forEach(function(n, i){
      const card = document.createElement('div');
      card.className = 'note';
      card.style.marginBottom = '10px';

      const txt = document.createElement('div');
      txt.className = 'note-txt';
      txt.contentEditable = 'true';
      txt.spellcheck = false;
      txt.textContent = n.text;
      txt.addEventListener('input', function(){ n.text = txt.textContent; save(); });
      txt.addEventListener('blur', function(){ txt.textContent = txt.textContent; });

      const foot = document.createElement('div');
      foot.className = 'note-foot';
      const when = document.createElement('span');
      when.textContent = (n.ts || '') + (n.by ? ' ' + n.by : '');
      const r = document.createElement('div');
      r.className = 'r';

      const edit = document.createElement('button');
      edit.title = '重新編輯';
      edit.setAttribute('aria-label','重新編輯記事');
      edit.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15.5 5.5l3 3M4.5 19.5l1-4L16 5l3 3L8.5 18.5l-4 1z"/></svg>';
      edit.addEventListener('click', function(){
        txt.focus();
        const sel = window.getSelection();
        const rng = document.createRange();
        rng.selectNodeContents(txt);
        rng.collapse(false);
        sel.removeAllRanges(); sel.addRange(rng);
      });

      const trash = document.createElement('button');
      trash.title = '刪除這則記事';
      trash.setAttribute('aria-label','刪除這則記事');
      trash.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4.5 7h15M9 7V4.8h6V7M6.5 7l.9 12.2h9.2L17.5 7"/></svg>';
      trash.addEventListener('click', function(){
        if(state.notes.length === 1) state.notes = [{ text:'', ts:'', by:'' }];
        else state.notes.splice(i,1);
        save(); renderNotes();
      });

      r.appendChild(edit); r.appendChild(trash);
      foot.appendChild(when); foot.appendChild(r);
      card.appendChild(txt); card.appendChild(foot);
      el.noteList.appendChild(card);
    });
    el.noteNum.textContent = state.notes.length + '/' + state.notes.length;
  }

  /* ---------- 渲染總控 ---------- */
  function renderAll(){
    document.body.classList.toggle('pure', !!state.pure);
    el.side.classList.toggle('hide', !state.sideOn && !isNarrow());
    el.btnSend.disabled = !el.input.value.trim();
    renderIdentity(); renderChat(); renderTags(); renderNotes();
  }

  function isNarrow(){ return window.matchMedia('(max-width:859px)').matches; }

  /* ---------- 送出 ---------- */
  function send(){
    const v = el.input.value.replace(/\s+$/,'');
    if(!v) return;
    state.messages.push({ id:'m' + Date.now(), side: state.role, type:'text', text:v, ts: Date.now() });
    el.input.value = '';
    el.input.style.height = 'auto';
    el.btnSend.disabled = true;
    save(); renderChat();
  }

  function pushImage(dataUrl){
    state.messages.push({ id:'m' + Date.now(), side: state.role, type:'image', img:dataUrl, ts:Date.now() });
    save(); renderChat();
  }

  function compressTo(file, max, cb){
    const fr = new FileReader();
    fr.onload = function(){
      const img = new Image();
      img.onload = function(){
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * s));
        const h = Math.max(1, Math.round(img.height * s));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.fillRect(0,0,w,h);
        ctx.drawImage(img, 0, 0, w, h);
        cb(cv.toDataURL('image/jpeg', 0.86));
      };
      img.onerror = function(){ toast('這張圖片讀取失敗，請換一張'); };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* ---------- 事件 ---------- */
  el.input.addEventListener('input', function(){
    el.btnSend.disabled = !el.input.value.trim();
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 120) + 'px';
  });
  el.input.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); }
  });
  el.btnSend.addEventListener('click', send);

  el.seg.addEventListener('click', function(e){
    const b = e.target.closest('button[data-role]');
    if(!b) return;
    state.role = b.dataset.role;
    save(); renderIdentity();
    el.input.focus();
  });

  $('fileImg').addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    compressTo(f, 720, function(url){ pushImage(url); });
    e.target.value = '';
  });

  /* 待處理 / 處理完畢 */
  function setStatus(txt){
    state.them.status = txt; save(); renderIdentity();
    $('btnPending').classList.toggle('on', state.them.status === '待處理');
    $('btnDone').classList.toggle('on', state.them.status === '處理完畢');
    toast('已標記為「' + txt + '」');
  }
  $('btnPending').addEventListener('click', function(){ setStatus('待處理'); });
  $('btnDone').addEventListener('click', function(){ setStatus('處理完畢'); });

  /* 搜尋對話內容 */
  $('btnSearch').addEventListener('click', function(){
    const kw = prompt('搜尋對話內容（輸入關鍵字）');
    if(kw === null) return;
    const q = kw.trim();
    if(!q){ toast('請輸入關鍵字'); return; }
    const hits = state.messages.filter(function(m){ return m.text && m.text.indexOf(q) > -1; });
    if(!hits.length){ toast('找不到「' + q + '」'); return; }
    const last = hits[hits.length - 1];
    const node = el.body.querySelector('[data-mid="' + last.id + '"]');
    if(node){
      node.scrollIntoView({ block:'center' });
      node.classList.remove('flash');
      void node.offsetWidth;
      node.classList.add('flash');
      setTimeout(function(){ node.classList.remove('flash'); }, 1400);
    }
    toast('找到 ' + hits.length + ' 筆，已跳到最近一筆');
  });

  $('btnInfo').addEventListener('click', function(){
    if(isNarrow()){
      el.side.classList.toggle('open');
    }else{
      state.sideOn = !state.sideOn; save(); renderAll();
      syncSettings();
    }
  });

  /* 設定面板 */
  const inpThemName = $('inpThemName'), inpThemStatus = $('inpThemStatus'), inpThemSub = $('inpThemSub'), inpMeName = $('inpMeName'), inpOwner = $('inpOwner');
  function syncSettings(){
    inpThemName.value = state.them.name;
    inpThemStatus.value = state.them.status || '';
    inpThemSub.value = state.them.sub || '';
    inpMeName.value = state.me.name;
    inpOwner.value = state.owner || '';
    $('tgSide').classList.toggle('on', !!state.sideOn);
    $('tgPure').classList.toggle('on', !!state.pure);
    $('btnPending').classList.toggle('on', state.them.status === '待處理');
    $('btnDone').classList.toggle('on', state.them.status === '處理完畢');
    el.prevThem.src = state.them.avatar;
  }
  function openPanel(){
    syncSettings();
    el.mask.classList.add('show');
  }
  function closePanel(){ el.mask.classList.remove('show'); }

  $('btnSettings').addEventListener('click', openPanel);
  $('panelClose').addEventListener('click', closePanel);
  el.mask.addEventListener('click', function(e){ if(e.target === el.mask) closePanel(); });
  $('sideEdit').addEventListener('click', openPanel);
  $('ownerEdit').addEventListener('click', function(){
    const v = prompt('負責人名稱', state.owner || '');
    if(v !== null){ state.owner = v.trim(); save(); renderIdentity(); syncSettings(); }
  });

  inpThemName.addEventListener('input', function(){
    state.them.name = inpThemName.value; save(); renderIdentity();
  });
  inpThemStatus.addEventListener('input', function(){
    state.them.status = inpThemStatus.value; save(); renderIdentity();
  });
  inpThemSub.addEventListener('input', function(){
    state.them.sub = inpThemSub.value; save(); renderIdentity();
  });
  inpMeName.addEventListener('input', function(){
    state.me.name = inpMeName.value; save(); renderIdentity();
  });
  inpOwner.addEventListener('input', function(){
    state.owner = inpOwner.value; save(); renderIdentity();
  });

  $('fileAvaThem').addEventListener('change', function(e){
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    compressTo(f, 320, function(url){
      state.them.avatar = url; save(); renderIdentity(); syncSettings();
      toast('客人頭像已更新');
    });
    e.target.value = '';
  });

  $('tgSide').addEventListener('click', function(){
    state.sideOn = !state.sideOn; save(); renderAll(); syncSettings();
  });
  $('tgPure').addEventListener('click', function(){
    state.pure = !state.pure; save();
    document.body.classList.toggle('pure', !!state.pure);
    syncSettings();
  });

  $('btnClear').addEventListener('click', function(){
    if(!confirm('確定清空所有對話訊息？')) return;
    state.messages = []; save(); renderChat(); closePanel(); toast('對話已清空');
  });
  $('btnSample').addEventListener('click', function(){
    state.messages = sampleMessages(); save(); renderChat(); closePanel(); toast('已載入範例對話');
  });

  $('noteAdd').addEventListener('click', function(){
    const d = new Date();
    state.notes.push({
      text:'',
      ts: d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()),
      by: state.owner || ''
    });
    save(); renderNotes();
    const last = el.noteList.lastElementChild;
    if(last){ const t = last.querySelector('.note-txt'); if(t){ t.focus(); } el.side.scrollTop = el.side.scrollHeight; }
  });

  el.lightbox.addEventListener('click', function(){ el.lightbox.classList.remove('show'); });

  document.addEventListener('click', function(e){
    const b = e.target.closest('[data-toast]');
    if(b){ toast(b.getAttribute('data-toast')); }
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape'){ closePanel(); el.lightbox.classList.remove('show'); }
  });

  window.addEventListener('resize', function(){
    el.side.classList.toggle('hide', !state.sideOn && !isNarrow());
    if(!isNarrow()) el.side.classList.remove('open');
  });

  /* ---------- 啟動 ---------- */
  load();
  if(!state.messages.length && !localStorage.getItem(KEY)) state.messages = sampleMessages();
  renderAll();
  syncSettings();
  el.btnSend.disabled = true;
})();
</script>
</body>
</html>
