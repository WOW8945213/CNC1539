<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>貸款方案試算比較</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="page">


<!-- 標題 -->

<header>

<h1>
貸款方案試算比較
</h1>

</header>




<!-- 輸入區 -->

<section class="input-box">


<div class="input-item">

<label>
貸款金額
</label>

<input id="money" value="2000000">

<span>元</span>

</div>



<div class="input-item">

<label>
貸款起始
</label>

<input id="year" value="115">

<span>年</span>


<input id="month" value="1">

<span>月</span>

</div>



<div class="input-item">

<label>
年利率
</label>

<input id="rate" value="3.3">

<span>%</span>

</div>



<button onclick="calculate()">
開始試算
</button>


</section>





<!-- 基本資訊 -->

<div id="info"></div>





<!-- 方案卡片 -->

<h2>
貸款方案比較
</h2>


<div id="plans" class="plans"></div>





<!-- 總覽 -->

<h2>
方案總覽
</h2>


<table id="summary-table"></table>





<!-- 備註 -->

<div class="note">


<h2>
計算說明
</h2>


<p>
計算方式：本息平均攤還
</p>

<p>
每月利息 = 剩餘本金 × 月利率
</p>

<p>
每月本金 = 每月應繳金額 - 當期利息
</p>


</div>



</div>



<script src="js/loan.js"></script>


</body>

</html>
