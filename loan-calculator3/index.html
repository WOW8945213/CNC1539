<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>貸款試算表</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="container">


<div class="title">
貸款試算表
</div>




<!-- 輸入區 -->

<div class="input-box">


<div class="row">

<div class="label">
貸款本金
</div>

<div class="input">

<input id="money" value="2000000">

元

</div>

</div>



<div class="row">

<div class="label">
貸款年數
</div>

<div class="input">

<input id="year" value="3">

年

</div>

</div>



<div class="row">

<div class="label">
貸款起始年月
</div>

<div class="input">

<input id="syear" value="115">

年

<input id="smonth" value="1">

月

</div>

</div>




<div class="row">

<div class="label">
年利率
</div>

<div class="input">

<input id="rate" value="3.3">

%

</div>

</div>



<div class="button-area">

<button onclick="calculate()">
開始試算
</button>


<button onclick="resetForm()">
清除
</button>


</div>


</div>






<!-- 結果 -->

<div id="result" class="result">


</div>






<!-- 明細 -->


<div class="table-box">


<h2>
還款明細表
</h2>


<div class="note">

※ 顯示前8期與後8期，中間期數省略

</div>



<table id="table">

</table>


</div>





</div>



<script src="js/loan.js"></script>


</body>

</html>
