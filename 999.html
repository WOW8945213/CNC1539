
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>本息平均攤還試算</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235798c2'/%3E%3Ctext x='32' y='44' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif'%3E貸%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ink:#344f68; --deep:#376b91; --blue:#78add0; --pale:#eaf5fc;
  --paper:#fbfdff; --line:#c8ddeb; --sky:#d9efff;
  --gold:#d6ad68; --coral:#c98272; --shadow:0 12px 30px rgba(57,103,137,.13);
}
*{box-sizing:border-box;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}
body{
  padding:24px 12px;margin:0;color:var(--ink);
  background:
    radial-gradient(ellipse at 12% 8%,rgba(255,255,255,.95) 0 7%,transparent 28%),
    radial-gradient(ellipse at 88% 20%,rgba(255,255,255,.78) 0 6%,transparent 25%),
    linear-gradient(160deg,#cce9fb 0%,#e5f3fc 52%,#f4f8fb 100%);
}
.wrap{
  max-width:820px;margin:0 auto;overflow:hidden;border:1px solid #b8d6e9;
  border-radius:24px;background:rgba(251,253,255,.97);box-shadow:var(--shadow);
}
.title-bar{
  position:relative;overflow:hidden;padding:24px 18px 20px;text-align:center;
  color:#fff;font-size:23px;font-weight:800;letter-spacing:2px;
  background:linear-gradient(120deg,#4c8db8,#72b2d8 58%,#a4d4ec);
  text-shadow:0 2px 4px rgba(38,81,111,.2);
}
.title-bar:before,.title-bar:after{
  content:"☁";position:absolute;color:rgba(255,255,255,.48);font-size:38px;
}
.title-bar:before{left:22px;top:8px}.title-bar:after{right:22px;bottom:2px}
.vt-toggle{display:flex;padding:8px;gap:8px;background:#edf6fc;border-bottom:1px solid var(--line)}
.vt-btn{
  flex:1;padding:10px;border:1px solid transparent;border-radius:13px;background:transparent;
  font-size:14px;cursor:pointer;color:var(--deep);font-weight:700;
}
.vt-btn.active{background:#5798c2;color:white;box-shadow:0 3px 8px rgba(55,107,145,.2)}
.input-area{padding:22px;background:linear-gradient(145deg,#eff8fe,#e0f0fa)}
.input-row{display:flex;align-items:center;margin:11px 0;gap:10px}
.input-row label{width:190px;padding:3px;font-size:15px;font-weight:700;color:#426783}
.input-row input{
  width:220px;min-width:0;padding:10px 12px;font-size:15px;color:var(--ink);
  background:#fff;border:1px solid #bcd6e7;border-radius:11px;outline:none;
}
.input-row input:focus{border-color:#65a6ce;box-shadow:0 0 0 3px rgba(101,166,206,.17)}
.input-row .unit{padding:0 3px;font-size:14px;color:#557b96}
.inline-group{display:flex;gap:6px;align-items:center}.inline-group input{width:94px}
.btn-group{text-align:center;margin:20px 0 2px}
button{
  padding:9px 17px;font-size:14px;margin:3px;cursor:pointer;font-family:inherit;
  color:#fff;background:#5798c2;border:0;border-radius:999px;
  box-shadow:0 3px 0 #39799f;transition:transform .15s,filter .15s;
}
button:hover{filter:brightness(1.06);transform:translateY(-1px)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #39799f}
#resultBlock{padding:18px}
h3{font-size:19px;margin:8px 0 14px;text-align:center;color:#39799f}
h4{font-size:15px;margin:12px 0 7px;color:#426f8e}
.param-strip{display:none}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px;overflow:hidden;border-radius:12px}
th{background:#5798c2;color:#fff;padding:10px 5px;text-align:center;font-size:14px}
td{border-bottom:1px solid #dceaf3;padding:8px 5px;text-align:center;font-size:13px}
/* 每12期固定交替：白雲色、淡天空藍；年度起始線清楚但不刺眼 */
tr.odd-year{background:#ffffff}
tr.even-year{background:#e8f4fc}
tr.odd-year td,tr.even-year td{background:transparent}
tr.year-start td{border-top:2px solid #b4d3e7}
.omit-row td{
  text-align:center;color:#55748b;background:#f3f8fc;font-size:13px;
  border-top:1px dashed #b7d2e3;border-bottom:1px dashed #b7d2e3
}
.result-summary{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;margin:12px 0;gap:9px}
.sum-card{
  border:1px solid #cbdfea;border-radius:15px;padding:12px 5px;text-align:center;
  background:linear-gradient(150deg,#fff,#eff7fc);box-shadow:0 3px 9px rgba(57,103,137,.07)
}
.sum-card div:first-child{font-size:13px;color:#527a96;font-weight:700}
.sum-card .big-red{font-size:22px;color:#c17b69;font-weight:800;margin-top:7px;white-space:nowrap}
.result-actions{display:none}
.tip-wrap{margin-top:14px;padding:14px;border-radius:15px;background:#eef6fb;border:1px dashed #b5d3e5}
.tip-text{font-size:14px;color:#405f76;margin-bottom:10px;line-height:1.7}
.copy-btn,.snap-btn,.full-btn{padding:8px 13px;font-size:13px}
.full-btn{background:#6e9fbd;box-shadow:0 3px 0 #4e7e9c}
.copy-btn{background:#5e9ebf;box-shadow:0 3px 0 #39799f}
.snap-btn{background:#829eae;box-shadow:0 3px 0 #627d8d}
/* 手機版 */
body[data-mode="mobile"]{padding:0}
body[data-mode="mobile"] .wrap{max-width:414px;border:none;border-radius:0;min-height:100vh}
body[data-mode="mobile"] .title-bar{font-size:18px;padding:18px 8px}
body[data-mode="mobile"] .vt-btn{font-size:15px;padding:11px 0}
body[data-mode="mobile"] .input-area{padding:12px}
body[data-mode="mobile"] .input-row{margin:10px 0;gap:6px}
body[data-mode="mobile"] .input-row label{width:145px;font-size:13px}
body[data-mode="mobile"] .input-row input{width:180px;font-size:16px;padding:8px}
body[data-mode="mobile"] .inline-group input{width:75px}
body[data-mode="mobile"] button{padding:9px 13px;font-size:14px;min-height:40px}
body[data-mode="mobile"] #resultBlock{padding:10px}
body[data-mode="mobile"] h3{font-size:18px;margin:2px 0 10px}
body[data-mode="mobile"] h4{font-size:13px;margin:10px 0 4px}
body[data-mode="mobile"] .param-strip{
  display:flex;flex-wrap:wrap;gap:4px 13px;background:#edf6fc;border:1px solid #cbdfea;
  border-radius:10px;padding:9px;font-size:12px;line-height:1.6
}
body[data-mode="mobile"] .param-strip b{color:#39799f}
body[data-mode="mobile"] .result-summary{grid-template-columns:1fr 1fr;gap:9px;margin:10px 0 0}
body[data-mode="mobile"] .sum-card{padding:12px 4px}
body[data-mode="mobile"] .sum-card div{font-size:13px}
body[data-mode="mobile"] .sum-card .big-red{font-size:22px;margin-top:5px}
body[data-mode="mobile"] table{table-layout:fixed;margin-top:7px}
body[data-mode="mobile"] th{padding:7px 2px;font-size:11px}
body[data-mode="mobile"] td{padding:6px 2px;font-size:11px}
body[data-mode="mobile"] th:nth-child(1){width:9%}
body[data-mode="mobile"] th:nth-child(2){width:14%}
body[data-mode="mobile"] th:nth-child(3){width:15%}
body[data-mode="mobile"] th:nth-child(4){width:15%}
body[data-mode="mobile"] th:nth-child(5){width:15%}
body[data-mode="mobile"] th:nth-child(6){width:32%}
body[data-mode="mobile"] .omit-row td{font-size:11px;padding:6px 2px}
body[data-mode="mobile"] .result-actions{display:flex;gap:8px;margin-top:12px}
body[data-mode="mobile"] .result-actions button{flex:1;margin:0}
@media(max-width:560px){
  body{padding:0}.wrap{border-radius:0}
  .input-row label{width:145px;font-size:13px}
  .input-row input{width:180px}.inline-group input{width:75px}
  .result-summary{grid-template-columns:1fr 1fr}
  th{font-size:11px;padding:7px 2px}td{font-size:11px;padding:6px 2px}
}
@media print{
  body *{visibility:hidden}
  #resultBlock,#resultBlock *{visibility:visible}
  #resultBlock{position:absolute;left:0;top:0;width:100%;border:none;background:white}
  .btn-group,.vt-toggle,button:not(.keep-print){display:none!important}
}
</style>
</head>
<body data-mode="web">
<div class="wrap">
  <div class="title-bar">☁️　🌿 本息平均攤還試算 🌿　☁️</div>
  <div class="vt-toggle">
    <button type="button" class="vt-btn active" data-mode="web" onclick="setMode('web')">💻 網頁版</button>
    <button type="button" class="vt-btn" data-mode="mobile" onclick="setMode('mobile')">📱 手機版</button>
  </div>
  <div class="input-area">
    <div class="input-row">
      <label>💰 您的貸款金額是：</label>
      <input type="number" id="principal" value="">
      <span class="unit">萬</span>
    </div>
    <div class="input-row">
      <label>🌳 貸款年數：</label>
      <input type="number" id="loanYear" value="">
      <span class="unit">年</span>
    </div>
    <div class="input-row">
      <label>🗓️ 貸款起始(民國)年月：</label>
      <div class="inline-group">
        <input type="number" id="rocYear" value="">
        <span class="unit">年</span>
        <input type="number" id="rocMonth" value="">
        <span class="unit">月</span>
      </div>
    </div>
    <div class="input-row">
      <label>🍃 年利率：</label>
      <input type="number" step="0.01" id="annualRate" value="">
      <span class="unit">%</span>
    </div>
    <div class="btn-group">
      <button onclick="calc()">✨ 開始試算</button>
      <button onclick="clearAll()">🧹 清除</button>
      <button onclick="printResult()">🖨️ 列印</button>
    </div>
  </div>
  <div id="resultBlock" style="display:none;">
    <h3>🌼 單筆試算結果</h3>
    <div class="param-strip" id="paramStrip"></div>
    <h4 id="detailTitle">📖 還款明細表（僅顯示前8期與後8期，中間期數省略）</h4>
    <div style="text-align:center;margin:6px 0;">
      <button class="full-btn keep-print" id="toggleFullBtn" onclick="toggleFullList()">顯示全部期數</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>期數</th>
          <th>繳款日期</th>
          <th>每月應繳</th>
          <th>本金</th>
          <th>利息</th>
          <th>剩餘本金</th>
        </tr>
      </thead>
      <tbody id="scheduleBody"></tbody>
    </table>
    <div class="result-summary" style="margin-top:10px;">
      <div class="sum-card">
        <div>🌙 每月應繳金額</div>
        <div class="big-red" id="monthPayText"></div>
      </div>
      <div class="sum-card">
        <div>💰 貸款本金</div>
        <div class="big-red" id="priText"></div>
      </div>
      <div class="sum-card">
        <div>🍂 總利息金額</div>
        <div class="big-red" id="totalIntText"></div>
      </div>
      <div class="sum-card">
        <div>🏡 總繳款金額</div>
        <div class="big-red" id="totalPayText"></div>
      </div>
    </div>
    <div class="result-actions">
      <button onclick="backToInput()">↩️ 返回修改</button>
      <button onclick="printResult()">🖨️ 列印</button>
    </div>
    <div class="tip-wrap">
      <div class="tip-text" id="autoTip"></div>
      <button class="copy-btn keep-print" id="copyBtn" onclick="copyTip()">📋 一鍵複製這段文字</button>
      <button class="snap-btn keep-print" id="snapBtn" onclick="openWinSnipping()">📸 系統截圖(Win+Shift+S)</button>
    </div>
  </div>
</div>
<script>
let lastCalc = null;
let tipContent = "";
let showAll = false; // 控制是否展開全部期數

function setMode(mode){
  document.body.dataset.mode = mode;
  document.querySelectorAll('.vt-btn').forEach(function(b){
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  if(lastCalc){
    renderResult();
  }else{
    backToInput();
  }
}

function calc(){
  const PWan = Number(document.getElementById('principal').value);
  const year = Number(document.getElementById('loanYear').value);
  const apr = Number(document.getElementById('annualRate').value);
  const rocY = Number(document.getElementById('rocYear').value);
  const rocM = Number(document.getElementById('rocMonth').value);
  if(!PWan||!year||!apr||!rocY||!rocM){
    return;
  }
  const P = PWan * 10000;
  const i = apr / 100 / 12;
  const n = year * 12;
  let payRate;
  if(Math.abs(i)<1e-12){
    payRate = 1 / n;
  }else{
    payRate = ( Math.pow(1+i,n) * i ) / ( Math.pow(1+i,n) - 1 );
  }
  const monthPay = P * payRate;
  let balance = P;
  let totalInterest = 0;
  const rows = [];
  let cy = rocY;
  let cm = rocM;
  for(let k=1;k<=n;k++){
    let intMonth = balance * i;
    let priMonth = monthPay - intMonth;
    if(k === n){
      priMonth = balance;
      intMonth = monthPay - priMonth;
    }
    balance = balance - priMonth;
    totalInterest += intMonth;
    let dateStr = cy + '/' + String(cm).padStart(2,'0');
    rows.push({
      period:k,
      date:dateStr,
      monthPay:monthPay,
      pri:priMonth,
      int:intMonth,
      bal:balance
    })
    cm++;
    if(cm>12){
      cm=1;
      cy++;
    }
  }
  lastCalc = { PWan: PWan, year: year, apr: apr, rocY: rocY, rocM: rocM, P: P, monthPay: monthPay, totalInterest: totalInterest, rows: rows };
  showAll = false; // 每次新試算預設為縮減版
  renderResult();
}

function toggleFullList(){
  showAll = !showAll;
  renderResult();
}

function renderResult(){
  if(!lastCalc) return;
  const d = lastCalc;
  const isMobile = document.body.dataset.mode === 'mobile';
  document.getElementById('paramStrip').innerHTML =
    '<span>貸款金額 <b>' + d.PWan.toLocaleString() + ' 萬</b></span>' +
    '<span>年數 <b>' + d.year + ' 年</b></span>' +
    '<span>年利率 <b>' + d.apr + '%</b></span>' +
    '<span>起算 <b>' + d.rocY + '/' + String(d.rocM).padStart(2,'0') + '</b></span>';

  const monthPayRound = Math.round(d.monthPay);
  document.getElementById('monthPayText').innerText = monthPayRound.toLocaleString() + ' 元';
  document.getElementById('priText').innerText = d.PWan.toLocaleString() + ' 萬';
  document.getElementById('totalPayText').innerText = Math.round(d.P + d.totalInterest).toLocaleString() + ' 元';
  document.getElementById('totalIntText').innerText = Math.round(d.totalInterest).toLocaleString() + ' 元';

  const totalPeriod = d.year * 12;
  tipContent = `幫您試算的是貸款金額${d.PWan.toLocaleString()}萬，分期${d.year}年${totalPeriod}期，每月應繳金額${monthPayRound.toLocaleString()} 元，您看一下月付金額您能不能負擔`;
  document.getElementById('autoTip').innerText = tipContent;

  const tbody = document.getElementById('scheduleBody');
  tbody.innerHTML = "";

  if(showAll){
    document.getElementById('detailTitle').innerText = '還款明細表（顯示全部期數）';
    document.getElementById('toggleFullBtn').innerText = '縮減顯示（前後幾期）';
    d.rows.forEach(function(r){
      addRow(tbody, r);
    })
  }else{
    const front = isMobile ? 6 : 8;
    const back = isMobile ? 6 : 8;
    document.getElementById('detailTitle').innerText = '還款明細表（僅顯示前' + front + '期與後' + back + '期，中間期數省略）';
    document.getElementById('toggleFullBtn').innerText = '顯示全部期數';
    d.rows.slice(0, front).forEach(function(r){ addRow(tbody, r); });
    const omitTr = document.createElement('tr');
    omitTr.className = "omit-row";
    omitTr.innerHTML = '<td colspan="6">……中間期數省略……</td>';
    tbody.appendChild(omitTr);
    d.rows.slice(-back).forEach(function(r){ addRow(tbody, r); });
  }

  const ia = document.querySelector('.input-area');
  const rb = document.getElementById('resultBlock');
  rb.style.display = "block";
  ia.style.display = isMobile ? "none" : "block";
  window.scrollTo(0,0);
}

function addRow(tbody,r){
  const tr = document.createElement('tr');
  // 每12期換底色：第1~12白色、13~24淺藍、25~36白色…
  const yearSeq = Math.ceil(r.period / 12);
  tr.className = (yearSeq % 2 === 1) ? "odd-year" : "even-year";
  // 每滿12期切換底色，並在新年度第一期加上清楚分隔線
  if(r.period > 1 && (r.period - 1) % 12 === 0){
    tr.classList.add("year-start");
  }
  tr.innerHTML = '' +
    '<td>' + r.period + '</td>' +
    '<td>' + r.date + '</td>' +
    '<td>' + Math.round(r.monthPay).toLocaleString() + '</td>' +
    '<td>' + Math.round(r.pri).toLocaleString() + '</td>' +
    '<td>' + Math.round(r.int).toLocaleString() + '</td>' +
    '<td>' + Math.round(r.bal).toLocaleString() + '</td>';
  tbody.appendChild(tr);
}

async function copyTip(){
  const btn = document.getElementById('copyBtn');
  try{
    await navigator.clipboard.writeText(tipContent);
    const oldText = btn.innerText;
    btn.innerText = "已複製";
    setTimeout(function(){
      btn.innerText = oldText;
    },1200);
  }catch(e){
  }
}

function openWinSnipping(){
  const btn = document.getElementById('snapBtn');
  const oldText = btn.innerText;
  btn.innerText = "已開啟截圖";
  window.location.href = "ms-screenclip://capture/image?rectangle";
  setTimeout(()=>{
    btn.innerText = oldText;
  },1200);
}

function backToInput(){
  lastCalc = null;
  tipContent = "";
  showAll = false;
  document.querySelector('.input-area').style.display = "block";
  document.getElementById('resultBlock').style.display = "none";
  window.scrollTo(0,0);
}

function clearAll(){
  document.getElementById('principal').value='';
  document.getElementById('loanYear').value='';
  document.getElementById('rocYear').value='';
  document.getElementById('rocMonth').value='';
  document.getElementById('annualRate').value='';
  lastCalc = null;
  tipContent = "";
  showAll = false;
  document.querySelector('.input-area').style.display = "block";
  document.getElementById('resultBlock').style.display="none";
}

function printResult(){
  if(document.getElementById('resultBlock').style.display === "none"){
    return;
  }
  window.print();
}
</script>
</body>
</html>
