<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>本息平均攤還試算</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;font-family: "Microsoft JhengHei", "Noto Sans TC", sans-serif;}
body{
  margin:0;
  padding:24px;
  background:#f8f8f8;
  color:#333;
}
.container{
  max-width:1600px;
  margin:0 auto;
}
.wrap{
  display:flex;
  flex-direction:column;
  gap:24px;
}
/*輸入面板*/
.left-panel{
  background:#ffffff;
  border-radius:14px;
  padding:22px;
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
  height:fit-content;
}
.left-panel h3{
  font-size:18px;
  margin:0 0 20px 0;
  color:#ff6a00;
  display:flex;
  align-items:center;
  gap:8px;
}
.left-panel h3::before{
  content:"";
  width:5px;height:18px;background:#ff6a00;border-radius:2px;
}
.field{
  margin-bottom:16px;
}
.field label{
  display:block;
  font-size:14px;
  color:#555;
  margin-bottom:6px;
}
.field input{
  width:100%;
  padding:11px 14px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}
.inline-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.btn-group{
  display:flex;
  gap:10px;
  margin-top:20px;
}
.btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}
.btn-orange{
  background:#ff6a00;
  color:#fff;
}
.btn-gray{
  background:#eeeeee;
  color:#333;
}

/*試算結果區域*/
.right-area{
  display:flex;
  flex-direction:column;
  gap:20px;
}
.result-header-bar{
  background:linear-gradient(90deg,#ff781f,#ff6300);
  color:#fff;
  padding:14px 20px;
  border-radius:12px;
  font-size:20px;
  font-weight:bold;
}
.summary-row{
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  gap:16px;
}
.sum-card{
  background:#fff8ef;
  border-radius:12px;
  padding:24px 20px;
}
.sum-card.orange{
  background:#ff6a00;
  color:#fff;
}
.sum-card .title{
  font-size:15px;
  color:#666;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:6px;
}
.sum-card.orange .title{color:#fff;}
.sum-card .num{
  font-size:34px;
  font-weight:bold;
  white-space:nowrap;
}
.sum-card.orange .num{color:#fff;}

/*還款明細*/
.detail-wrap{
  background:#fff;
  border-radius:12px;
  padding:20px;
}
.detail-top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.detail-title{
  font-size:18px;
  font-weight:bold;
  display:flex;align-items:center;gap:8px;
}
.btns-right{
  display:flex;gap:10px;
}
.btn-excel{
  background:#28a745;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold;
}
.btn-pdf{
  background:#dc3545;color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:bold;
}
/*前8、後8表格平行並列*/
.two-table-row{
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap:20px;
}
.table-block{
  background:#fff8ef;
  border-radius:10px;
  padding:16px;
}
.table-block h4{
  margin:0 0 12px 0;
  font-size:16px;
}
table{
  width:100%;
  border-collapse: collapse;
}
th,td{
  text-align:center;
  padding:8px 4px;
  font-size:14px;
  border:1px solid #ddd;
}
th{
  background:#f4f4f4;
  color:#333;
  font-weight:bold;
}
</style>
</head>
<body>
<div class="container">
  <div class="wrap">
    <!-- 輸入面板在上 -->
    <div class="left-panel">
      <h3>貸款試算設定</h3>
      <div class="field">
        <label>貸款金額（萬元）</label>
        <input type="number" id="loanAmtWan">
      </div>
      <div class="field">
        <label>貸款年數</label>
        <input type="number" id="loanYear">
      </div>
      <div class="inline-row">
        <div class="field">
          <label>起始民國年</label>
          <input type="number" id="rocY">
        </div>
        <div class="field">
          <label>起始月份</label>
          <input type="number" id="rocM">
        </div>
      </div>
      <div class="field">
        <label>年利率 %</label>
        <input type="number" step="0.01" id="rate">
      </div>
      <div class="btn-group">
        <button class="btn btn-orange" onclick="calc()">試算</button>
        <button class="btn btn-gray" onclick="clearForm()">清除</button>
      </div>
    </div>

    <!-- 試算結果在下方，垂直排列 -->
    <div class="right-area" id="resultWrap" style="display:none;">
      <div class="result-header-bar">
        試算結果摘要
      </div>
      <!--4個摘要卡片同一橫列-->
      <div class="summary-row">
        <div class="sum-card">
          <div class="title">貸款金額</div>
          <div class="num" id="cardLoan">0元</div>
        </div>
        <div class="sum-card">
          <div class="title">每月應繳金額</div>
          <div class="num" id="cardMonthPay">0元</div>
        </div>
        <div class="sum-card">
          <div class="title">總利息</div>
          <div class="num" id="cardTotalInt">0元</div>
        </div>
        <div class="sum-card orange">
          <div class="title">總計繳款金額</div>
          <div class="num" id="cardTotalPay">0元</div>
        </div>
      </div>
      <!-- 還款明細 -->
      <div class="detail-wrap">
        <div class="detail-top-bar">
          <div class="detail-title">還款明細</div>
          <div class="btns-right">
            <button class="btn-excel">Excel匯出</button>
            <button class="btn-pdf">PDF列印</button>
          </div>
        </div>
        <!-- 兩個表格左右平行並列 -->
        <div class="two-table-row">
          <!--前8期表格-->
          <div class="table-block">
            <h4>前8期（第1～8期）</h4>
            <table>
              <thead>
                <tr>
                  <th>期數</th>
                  <th>應繳總額</th>
                  <th>利息</th>
                  <th>本金</th>
                  <th>剩餘本金</th>
                </tr>
              </thead>
              <tbody id="tableFront8"></tbody>
            </table>
          </div>
          <!--後8期表格-->
          <div class="table-block">
            <h4>後8期（<span id="backTitle">77～84期</span>）</h4>
            <table>
              <thead>
                <tr>
                  <th>期數</th>
                  <th>應繳總額</th>
                  <th>利息</th>
                  <th>本金</th>
                  <th>剩餘本金</th>
                </tr>
              </thead>
              <tbody id="tableBack8"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
function calc(){
  const wanVal = Number(document.getElementById("loanAmtWan").value);
  const y = Number(document.getElementById("loanYear").value);
  const apr = Number(document.getElementById("rate").value);
  const rocY = Number(document.getElementById("rocY").value);
  const rocM = Number(document.getElementById("rocM").value);
  if(!wanVal || !y || !apr){
    alert("請填寫貸款金額、年數、年利率");
    return;
  }
  const principal = wanVal * 10000;
  const monthRate = apr /100 /12;
  const totalMonth = y * 12;
  //本息平均攤還公式
  let monthPay;
  if(monthRate === 0){
    monthPay = principal / totalMonth;
  }else{
    monthPay = principal * monthRate * Math.pow(1+monthRate, totalMonth) / (Math.pow(1+monthRate,totalMonth)-1);
  }
  monthPay = Math.round(monthPay);

  let balance = principal;
  let totalInterest = 0;
  let schedule = [];
  for(let i=0; i<totalMonth;i++){
    let interest = balance * monthRate;
    let capital = monthPay - interest;
    //最後一期修正尾數
    if(i === totalMonth -1){
      capital = balance;
      interest = monthPay - capital;
    }
    balance = balance - capital;
    totalInterest += interest;
    schedule.push({
      period:i+1,
      pay:monthPay,
      interest:Math.round(interest),
      capital:Math.round(capital),
      remain:Math.round(balance)
    })
  }
  totalInterest = Math.round(totalInterest);
  const totalPay = principal + totalInterest;

  //填入卡片
  document.getElementById("cardLoan").innerText = principal.toLocaleString() + " 元";
  document.getElementById("cardMonthPay").innerText = monthPay.toLocaleString() + " 元";
  document.getElementById("cardTotalInt").innerText = totalInterest.toLocaleString() + " 元";
  document.getElementById("cardTotalPay").innerText = totalPay.toLocaleString() + " 元";

  //前8期
  const frontTbody = document.getElementById("tableFront8");
  frontTbody.innerHTML = "";
  for(let i=0;i<8;i++){
    const r = schedule[i];
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.period}</td><td>${r.pay.toLocaleString()}</td><td>${r.interest.toLocaleString()}</td><td>${r.capital.toLocaleString()}</td><td>${r.remain.toLocaleString()}</td>`;
    frontTbody.appendChild(tr);
  }
  //後8期
  const backStart = totalMonth - 8;
  document.getElementById("backTitle").innerText = `${backStart+1}～${totalMonth}期`;
  const backTbody = document.getElementById("tableBack8");
  backTbody.innerHTML = "";
  for(let i=backStart; i<totalMonth;i++){
    const r = schedule[i];
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${r.period}</td><td>${r.pay.toLocaleString()}</td><td>${r.interest.toLocaleString()}</td><td>${r.capital.toLocaleString()}</td><td>${r.remain.toLocaleString()}</td>`;
    backTbody.appendChild(tr);
  }
  document.getElementById("resultWrap").style.display = "flex";
}
function clearForm(){
  document.getElementById("loanAmtWan").value = "";
  document.getElementById("loanYear").value = "";
  document.getElementById("rocY").value = "";
  document.getElementById("rocM").value = "";
  document.getElementById("rate").value = "";
  document.getElementById("resultWrap").style.display = "none";
}
</script>
</body>
</html>
