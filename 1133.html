<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>本息平均攤還試算</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;font-family: "Microsoft JhengHei",sans-serif;}
body{padding:10px;background:#fff;margin:0;}
.wrap{max-width:720px;margin:0 auto;border:1px solid #337ab7;}
.title-bar{background:#2767ad;color:#fff;padding:8px;text-align:center;font-size:18px;font-weight:bold;}
.input-area{background:#e8f2ff;padding:10px;}
.input-row{display:flex;align-items:center;margin:6px 0;gap:6px;}
.input-row label{width:180px;padding:3px;font-size:14px;}
.input-row input{padding:5px;font-size:14px;width:200px;}
.input-row .unit{padding:0 3px;font-size:14px;}
.inline-group{display:flex;gap:6px;align-items:center;}
.inline-group input{width:90px;}
.btn-group{text-align:center;margin:8px 0;}
button{padding:5px 12px;font-size:14px;margin:0 3px;cursor:pointer;}
.result-summary{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;margin:8px 0;gap:6px;}
.sum-card{border:1px solid #ccc;padding:4px 2px;text-align:center;}
.sum-card div{font-size:23px;}
.sum-card .big-red{
  font-size:24px;color:red;font-weight:bold;margin-top:4px;
  white-space:nowrap;
}
table{width:100%;border-collapse:collapse;margin-top:8px;}
th{background:#2767ad;color:#fff;padding:6px;text-align:center;font-size:14px;}
td{border:1px solid #ccc;padding:5px;text-align:center;font-size:13px;}
.omit-row td{text-align:center;color:#333;background:#f4f8ff;font-size:13px;}
#resultBlock{padding:8px;}
h3{font-size:16px;margin:6px 0;}
h4{font-size:14px;margin:6px 0;}
.block-line{margin:12px 0;border-top:1px solid #999;}
.batch-item{border:1px solid #ccc;padding:10px;margin:8px 0;}

/* ========== 列印專用CSS ========== */
@media print {
    body * {
        visibility: hidden;
    }
    #resultBlock, #resultBlock * {
        visibility: visible;
    }
    #resultBlock {
        position: absolute;
        left:0;
        top:0;
        width:100%;
        border:none;
    }
    .btn-group, button {
        display: none !important;
    }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="title-bar">本息平均攤還試算</div>
  <div class="input-area">
    <h4>【單筆試算】</h4>
    <div class="input-row">
      <label>您的貸款金額是：</label>
      <input type="number" id="principal" value="">
      <span class="unit">萬</span>
    </div>
    <div class="input-row">
      <label>貸款年數：</label>
      <input type="number" id="loanYear" value="">
      <span class="unit">年</span>
    </div>
    <div class="input-row">
      <label>貸款起始(民國)年月：</label>
      <div class="inline-group">
        <input type="number" id="rocYear" value="">
        <span class="unit">年</span>
        <input type="number" id="rocMonth" value="">
        <span class="unit">月</span>
      </div>
    </div>
    <div class="input-row">
      <label>年利率：</label>
      <input type="number" step="0.01" id="annualRate" value="">
      <span class="unit">%</span>
    </div>
    <div class="btn-group">
      <button onclick="calc()">單筆試算</button>
    </div>

    <div class="block-line"></div>
    <h4>【區間批量試算】</h4>
    <div class="input-row">
      <label>起始貸款金額：</label>
      <input type="number" id="startPri" value="">
      <span class="unit">萬</span>
    </div>
    <div class="input-row">
      <label>結束貸款金額：</label>
      <input type="number" id="endPri" value="">
      <span class="unit">萬</span>
    </div>
    <div class="input-row">
      <label>貸款年數：</label>
      <input type="number" id="batchLoanYear" value="">
      <span class="unit">年</span>
    </div>
    <div class="input-row">
      <label>年利率：</label>
      <input type="number" step="0.01" id="batchRate" value="">
      <span class="unit">%</span>
    </div>
    <div class="btn-group">
      <button onclick="batchCalc()">多筆金額批量試算</button>
      <button onclick="clearAll()">全部清除</button>
      <button onclick="printResult()">列印</button>
    </div>
  </div>

  <div id="resultBlock" style="display:none;">
    <h3>試算結果</h3>
    <div id="resultContent"></div>
  </div>
</div>

<script>
// 共用試算函式
function calcOne(PWan,year,apr,rocY,rocM){
  const P = PWan * 10000; //輸入是萬，轉成元計算
  const i = apr / 100 / 12;
  const n = year * 12;
  let payRate;
  if(Math.abs(i)<1e-12){
    payRate = 1 / n;
  }else{
    payRate = ( Math.pow(1+i,n) * i ) / ( Math.pow(1+i,n) - 1 );
  }
  const monthPay = P * payRate;
  let balance = P;
  let totalInterest = 0;
  const rows = [];
  let cy = rocY;
  let cm = rocM;
  for(let k=1;k<=n;k++){
    let intMonth = balance * i;
    let priMonth = monthPay - intMonth;
    if(k === n){
      priMonth = balance;
      intMonth = monthPay - priMonth;
    }
    balance = balance - priMonth;
    totalInterest += intMonth;
    let dateStr = `${cy}/${String(cm).padStart(2,'0')}`;
    rows.push({
      period:k,
      date:dateStr,
      monthPay:monthPay,
      pri:priMonth,
      int:intMonth,
      bal:balance
    })
    cm++;
    if(cm>12){
      cm=1;
      cy++;
    }
  }
  return {
    monthPay,
    totalInterest,
    totalPay:P+totalInterest,
    principal:P,
    principalWan:PWan,
    rows
  }
}

// 單筆試算
function calc(){
  const PWan = Number(document.getElementById('principal').value);
  const year = Number(document.getElementById('loanYear').value);
  const apr = Number(document.getElementById('annualRate').value);
  const rocY = Number(document.getElementById('rocYear').value);
  const rocM = Number(document.getElementById('rocMonth').value);
  if(!PWan||!year||!apr||!rocY||!rocM){
    alert("請填寫完整單筆欄位");
    return;
  }
  const res = calcOne(PWan,year,apr,rocY,rocM);
  const html = buildSingleHtml(res);
  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('resultBlock').style.display="block";
}

// 組單筆結果HTML
function buildSingleHtml(res){
  let tableHtml = `<h4>還款明細表（僅顯示前8期與後8期，中間期數省略）</h4>
  <table>
  <thead>
    <tr>
      <th>期數</th>
      <th>繳款日期</th>
      <th>每月應繳</th>
      <th>本金</th>
      <th>利息</th>
      <th>剩餘本金</th>
    </tr>
  </thead><tbody>`;
  const showFront = res.rows.slice(0,8);
  const showBack = res.rows.slice(-8);
  showFront.forEach(r=>{
    tableHtml += `<tr>
      <td>${r.period}</td>
      <td>${r.date}</td>
      <td>${Math.round(r.monthPay).toLocaleString()}</td>
      <td>${Math.round(r.pri).toLocaleString()}</td>
      <td>${Math.round(r.int).toLocaleString()}</td>
      <td>${Math.round(r.bal).toLocaleString()}</td>
    </tr>`;
  })
  tableHtml += `<tr class="omit-row"><td colspan="6">……中間期數省略……</td></tr>`;
  showBack.forEach(r=>{
    tableHtml += `<tr>
      <td>${r.period}</td>
      <td>${r.date}</td>
      <td>${Math.round(r.monthPay).toLocaleString()}</td>
      <td>${Math.round(r.pri).toLocaleString()}</td>
      <td>${Math.round(r.int).toLocaleString()}</td>
      <td>${Math.round(r.bal).toLocaleString()}</td>
    </tr>`;
  })
  tableHtml += `</tbody></table>`;

  const cardHtml = `
  <div class="result-summary" style="margin-top:10px;">
      <div class="sum-card">
        <div>每月應繳金額</div>
        <div class="big-red">${Math.round(res.monthPay).toLocaleString()} 元</div>
      </div>
      <div class="sum-card">
        <div>貸款本金</div>
        <div class="big-red">${res.principalWan.toLocaleString()} 萬</div>
      </div>
      <div class="sum-card">
        <div>總利息金額</div>
        <div class="big-red">${Math.round(res.totalInterest).toLocaleString()} 元</div>
      </div>
      <div class="sum-card">
        <div>總繳款金額</div>
        <div class="big-red">${Math.round(res.totalPay).toLocaleString()} 元</div>
      </div>
    </div>`;
  return tableHtml + cardHtml;
}

// 區間批量試算
function batchCalc(){
  const startWan = Number(document.getElementById('startPri').value);
  const endWan = Number(document.getElementById('endPri').value);
  const year = Number(document.getElementById('batchLoanYear').value);
  const apr = Number(document.getElementById('batchRate').value);
  const stepWan = 10; //固定遞增10萬
  if(!startWan||!endWan||!year||!apr){
    alert("請填寫完整區間欄位");
    return;
  }
  if(startWan>endWan){
    alert("起始金額不可大於結束金額");
    return;
  }
  let html = "";
  let rocY=114,rocM=1;
  for(let pw=startWan;pw<=endWan;pw+=stepWan){
    const res = calcOne(pw,year,apr,rocY,rocM);
    html += `<div class="batch-item">
    <h4>貸款本金：${pw.toLocaleString()} 萬</h4>
    <div class="result-summary">
      <div class="sum-card">
        <div>每月應繳金額</div>
        <div class="big-red">${Math.round(res.monthPay).toLocaleString()} 元</div>
      </div>
      <div class="sum-card">
        <div>貸款本金</div>
        <div class="big-red">${pw.toLocaleString()} 萬</div>
      </div>
      <div class="sum-card">
        <div>總利息金額</div>
        <div class="big-red">${Math.round(res.totalInterest).toLocaleString()} 元</div>
      </div>
      <div class="sum-card">
        <div>總繳款金額</div>
        <div class="big-red">${Math.round(res.totalPay).toLocaleString()} 元</div>
      </div>
    </div>
    </div>`;
  }
  document.getElementById('resultContent').innerHTML = html;
  document.getElementById('resultBlock').style.display="block";
}

// 清除全部欄位與結果
function clearAll(){
  document.getElementById('principal').value='';
  document.getElementById('loanYear').value='';
  document.getElementById('rocYear').value='';
  document.getElementById('rocMonth').value='';
  document.getElementById('annualRate').value='';
  document.getElementById('startPri').value='';
  document.getElementById('endPri').value='';
  document.getElementById('batchLoanYear').value='';
  document.getElementById('batchRate').value='';
  document.getElementById('resultBlock').style.display="none";
}

// 列印功能
function printResult(){
  if(document.getElementById('resultBlock').style.display === "none"){
    alert("請先執行試算，才能列印！");
    return;
  }
  window.print();
}
</script>
</body>
</html>
